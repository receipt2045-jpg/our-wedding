<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OUR WEDDING · 우리 결혼 가계부</title>
<meta name="description" content="회원가입 없이 바로 쓰는 결혼 가계부. 예산·지출·하객·할 일·웨딩홀 비교를 한곳에서.">
<meta name="theme-color" content="#FFF0A6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --acc:#FFF0A6; --acc2:#FFF6C9; --accs:#FFFCEC; --accl:#F1DC6E; --accd:#D9B300; --acct:#3A3200;
  --r:0px; --rb:0px; --rp:0px; --rbar:0px; --hf:Pretendard,-apple-system,sans-serif; --ink:#1C1F26; --sub:#4F5563; --muted:#8B909B;
  --line:#EEEEEE; --bg:#FFFFFF; --track:#F2F2F2; --stripe:repeating-linear-gradient(135deg,#FFF0A6 0 4px,#FFF6C9 4px 8px); --card:#fff; --red:#DC4449; --rsoft:#FFF0F0; --green:#1C9A57; 
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);font-family:Pretendard,-apple-system,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.num{text-align:right;white-space:nowrap}
.mut{color:var(--muted)} .red{color:var(--red)} .grn{color:var(--green)}
.b{font-weight:700}

/* ---------- 목업 조작부 ---------- */
#ctrl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#fff;color:var(--sub);font-size:13px;border-bottom:1px solid var(--line)}
#ctrl b{font-size:14px}
#ctrl .g{display:flex;gap:4px;align-items:center}
#ctrl button{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:8px;padding:5px 10px;font-size:13px}
#ctrl button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}

/* ---------- 앱 골격 ---------- */
#app{margin:0 auto}
#app.pc{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:calc(100vh - 44px);max-width:1360px}
#app.mo{max-width:400px;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:calc(100vh - 44px)}
#side{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
#app.mo #side{display:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:.05em;padding:0 8px;white-space:nowrap}
.logo i{flex:0 0 22px;width:22px;height:22px;border-radius:calc(var(--rb) * .7);background:var(--acc);display:inline-block}
.logo small{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.couple{margin:18px 8px 16px;padding:12px;border-radius:var(--rb);background:var(--accs)}
.couple .n{font-size:14px;font-weight:700}
.couple .d{font-size:22px;font-weight:800;letter-spacing:-.5px}
.couple .s{font-size:12px;color:var(--sub)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:none;padding:11px 12px;border-radius:var(--rb);font-size:16px;color:var(--sub)}
.nav button:hover{background:var(--accs)}
.nav button.on{background:var(--acc);color:var(--ink);font-weight:700}
.nav button .lk{font-size:12px;color:var(--muted)}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
.side-foot button{width:100%;border:1px dashed #DDDDDD;background:#fff;border-radius:10px;padding:10px;font-size:14px;margin-bottom:10px;color:var(--ink)}

#mhead{display:none}
#app.mo #mhead{display:block;position:sticky;top:0;z-index:20;background:var(--bg)}
.mtop{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.mtop .r{font-size:13px;color:var(--sub);text-align:right;line-height:1.3}
.mtop .r b{font-size:16px;color:var(--ink)}
.mtabs{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.mtabs::-webkit-scrollbar{display:none}
.mtabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:var(--rp);padding:7px 14px;font-size:15px;color:var(--sub)}
.mtabs button.on{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:700}

main{padding:28px 32px 60px;min-width:0}
#app.mo main{padding:16px 16px 20px}
.ph{margin-bottom:18px}
.ph h1{font-size:26px;margin:0;letter-spacing:-.6px}
#app.mo .ph h1{font-size:22px}
.ph p{margin:4px 0 0;color:var(--sub);font-size:15px}
.ph p b{background:linear-gradient(transparent 55%,var(--acc2) 55%);font-weight:700;color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
#app.mo .card{padding:16px}
.card h2{font-size:17px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 .more{font-size:13px;font-weight:500;color:var(--sub);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
#app.mo .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
#app.mo .g2,#app.mo .g3{grid-template-columns:1fr}
.mt{margin-top:14px}

.kpi .l{font-size:13px;color:var(--sub)}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.25}
#app.mo .kpi .v{font-size:21px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--acc);border-color:var(--acc)}
.kpi.hl .l,.kpi.hl .s{color:var(--acct)}

.bar{height:10px;border-radius:var(--rbar);background:var(--track);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .p{background:var(--acc)} .bar .q{background:var(--stripe)} .bar .o{background:var(--red)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:6px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}.legend .lp{--c:var(--acc)} .legend .lq{--c:var(--stripe)} .legend .lo{--c:var(--red)}

.brow{padding:10px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .t{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}
.brow .t b{font-size:15px}

.list .it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.list .it:last-child{border-bottom:0}
.list .it small{display:block;color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;background:#fff;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.tag.y{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:700}
.tag.r{color:var(--red);font-weight:700}
.tag.g{background:#E9F7EF;color:var(--green)}
.aff{font-size:12px;color:var(--sub);text-decoration:underline;text-underline-offset:2px;white-space:nowrap;cursor:pointer}
.aff:after{content:" 제휴";font-size:10px;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 3px;margin-left:3px;display:inline-block}

.guide{display:flex;gap:14px;align-items:center;background:#fff;border:1.5px solid var(--acc)}
.guide img{width:84px;height:84px;object-fit:contain;flex:0 0 auto}
.guide ol{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--sub)}
.guide ol li{margin:2px 0}
.guide ol b{color:var(--ink)}
.warn{display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--acc)}
.warn img{width:64px;height:64px;object-fit:contain}
.warn .h{font-size:13px;color:var(--red);font-weight:700}

.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
#app.mo .pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}
.pills button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:var(--rp);padding:6px 13px;font-size:14px;color:var(--sub)}
.pills button.on{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:700}
.pills button small{opacity:.7;margin-left:4px}
.basis{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:12px;cursor:pointer}
.basis b{color:var(--ink);border-bottom:2px solid var(--acc)}

/* 표 */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-size:13px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff;white-space:nowrap;position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid #F4F4F4;vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal;min-width:150px}
td small.cat{display:block;font-size:12px;color:var(--muted);font-weight:400}
tr:last-child td{border-bottom:0}
tr.big td{background:#fff;font-weight:800;font-size:16px;padding:14px 12px 10px;border-bottom:2px solid var(--acc)}
tr.grp td{background:#fff;font-weight:700;color:var(--sub);font-size:14px}
tr.plan td{background:var(--accs)}
td.nm{font-weight:500}
input.ly{width:96px;text-align:right;border:1px solid var(--accl);background:var(--accs);border-radius:8px;padding:6px 8px;font-weight:700}
input.ly:focus{outline:2px solid var(--acc);background:#fff}
.u{font-size:12px;color:var(--muted);margin-left:3px}
.pb{display:flex;align-items:center;gap:8px;min-width:120px}
.pb .bar{flex:1;height:8px}
.pb span{font-size:12px;color:var(--muted);width:34px;text-align:right}
.soon{font-size:12px;color:#B3B6BE}
.addrow{border:1px dashed #DDDDDD;background:#fff;border-radius:10px;padding:7px 12px;font-size:13px;color:var(--sub)}
input.nmin{border:1px solid var(--line);border-radius:8px;padding:5px 8px;width:140px}
.x{border:0;background:none;color:#B8BBC2;font-size:16px}

/* 입력 폼 */
.form{display:grid;grid-template-columns:150px minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.2fr);gap:10px 10px;align-items:end}
.form .last{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.form .last .chk{padding:0}
.form label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.form input,.form select{width:100%;border:1px solid #DAD9D2;border-radius:10px;padding:9px 10px;background:#fff}
.form input:focus,.form select:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:6px 0;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--acc);font-weight:700}
.btn{border:0;background:var(--acc);border-radius:var(--rb);padding:10px 18px;font-weight:800;white-space:nowrap}
.btn.dk{background:var(--acc);color:var(--ink)}
.btn.wide{width:100%;padding:14px;font-size:16px}
.chk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--sub);white-space:nowrap;padding-bottom:10px}
.hint{font-size:13px;color:var(--sub);margin-top:8px;min-height:20px}
.hint b{color:var(--ink)}
.mform label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px;font-weight:600}
.mform input,.mform select{width:100%;border:1px solid #DAD9D2;border-radius:12px;padding:12px;font-size:16px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mform .btn.wide{position:sticky;bottom:-26px;box-shadow:0 -10px 16px #fff}
.chips button{border:1px solid var(--line);background:#fff;border-radius:var(--rp);padding:7px 12px;font-size:14px}
.chips button.on{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:700}

/* 모바일 카드 행 */
.mrow{padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .a{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mrow .a .n{font-size:16px;font-weight:600}
.mrow .s{font-size:13px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.mrow .bar{height:6px;margin-top:6px}
.mgh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 6px;font-size:14px;font-weight:700;color:var(--sub)}
.fabw{position:sticky;bottom:16px;display:flex;justify-content:flex-end;pointer-events:none;margin-top:16px}
.fab{pointer-events:auto;border:0;background:var(--acc);color:var(--acct);border-radius:var(--rp);padding:14px 20px;font-size:16px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fab i{color:var(--ink);font-style:normal;margin-right:4px}

/* 차트 */
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.cols .c i{display:block;width:100%;max-width:28px;border-radius:4px 4px 0 0}
.cols .c i.q{background:var(--stripe)} .cols .c i.p{background:var(--acc);border-radius:0}
.cols .c i.p:first-child{border-radius:4px 4px 0 0}
.cols .c span{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.cols .c em{font-size:10px;color:var(--sub);font-style:normal;margin-bottom:2px}
.split{display:flex;height:28px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:700}
.split div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}

/* 하객 */
.tg{border:1.5px solid var(--line);background:#fff;border-radius:8px;width:34px;height:30px;font-size:15px;color:#C9CBD1}
.tg.on{background:var(--acc);border-color:var(--accl);color:var(--ink);font-weight:800}
input.sm{width:64px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;text-align:right}
input.md{width:110px;border:1px solid var(--line);border-radius:8px;padding:5px 7px}
select.sm{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);cursor:pointer;user-select:none}
.switch i{width:38px;height:22px;border-radius:12px;background:#E6E6E6;position:relative;transition:.15s}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch.on i{background:var(--acc)} .switch.on i:after{left:19px}
.mg{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.mg .tg{width:auto;padding:0 10px;font-size:13px;height:30px}

/* 할일 */
.stages{display:flex;flex-direction:column;gap:4px}
.stages button{display:block;text-align:left;border:1px solid transparent;background:none;border-radius:12px;padding:10px 12px}
.stages button.on{background:#fff;border:1.5px solid var(--acc)}
.stages .t{display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.stages .bar{height:6px;margin-top:6px}
.todo .it{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.todo .it:last-child{border-bottom:0}
.todo .cb{width:26px;height:26px;border-radius:8px;border:2px solid #DDDDDD;background:#fff;flex:0 0 auto;font-size:15px;font-weight:900;line-height:1;color:var(--ink)}
.todo .cb.on{background:var(--acc);border-color:var(--accl)}
.todo .cb.auto{background:var(--acc);border-color:var(--accl);color:var(--ink)}
.todo .tx{flex:1;font-size:16px}
.todo .tx small{display:block;font-size:12px;color:var(--muted)}
.todo .it.done .tx>span{color:var(--muted);text-decoration:line-through}


.mcell{width:330px;flex:0 0 auto;font-size:13px;color:var(--sub)}
#app.mo .mcell{width:auto;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mcell .mh{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;font-weight:600;color:var(--ink)}
.mcell .mr{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;margin-bottom:5px;white-space:nowrap}
#app.mo .mcell .mr{flex-wrap:wrap}
.mcell .mr .mini{margin-left:auto}
.mcell .mr b{color:var(--ink)}
.mcell input.ly{width:70px;padding:4px 6px}
.mcell .bar{height:6px}
#app.mo .tsum{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#app.mo .tsum .card{padding:10px}
#app.mo .tsum .v{font-size:17px}
#app.mo .tsum .v span{display:block;font-size:12px!important}
#app.mo .tsum .s{display:none}
#app.mo .tsum .l{font-size:12px}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
.mini:hover{background:var(--acc);border-color:var(--acc)}
.todo .it{align-items:flex-start}
.todo .cb{margin-top:2px}

/* ---------- 테마 공통 ---------- */
.ph h1,.logo,.card h2,.headline,#dlg h3,.couple .d{font-family:var(--hf)}
.nav button.on,.mtabs button.on,.pills button.on,.chips button.on,.seg button.on,.btn,.btn.dk,.tag.y,.kpi.hl,.tg.on,.todo .cb.on,.todo .cb.auto,.opts button.on{color:var(--acct)}
.kpi.hl .l,.kpi.hl .s{color:var(--acct);opacity:.75}
.pick,.basis b{border-bottom-color:var(--accd)}
.wi{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--red);color:var(--red);font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}
#dlg .mk{width:64px;height:64px;border-radius:var(--r);background:var(--acc);margin:0 auto 14px}
/* 시안 비교 */
.th-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.th-grid.th5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:900px){.th-grid,.th-grid.th5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.th-grid,.th-grid.th5{grid-template-columns:1fr}.th .ds{min-height:0}}
#ctrl .g{flex-wrap:wrap}
#ctrl span,#ctrl button{white-space:nowrap}
.th{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:var(--ink)}
.th:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.th.on{outline:3px solid var(--ink)}
.th .nm{font-size:15px;font-weight:800;margin-bottom:2px}
.th .ds{font-size:12px;color:var(--muted);margin-bottom:10px;min-height:34px}
.th .mini{border:1px solid #EEE;border-radius:var(--r);padding:10px;font-size:12px;background:#fff}
.th .mlogo{display:flex;align-items:center;gap:6px;font-family:var(--hf);font-weight:800;letter-spacing:.08em;font-size:12px;margin-bottom:8px}
.th .mlogo i{width:12px;height:12px;border-radius:calc(var(--rb) * .4);background:var(--acc)}
.th .mnav{display:flex;gap:4px;margin-bottom:8px}
.th .mnav span{padding:3px 8px;border-radius:var(--rp);border:1px solid #EEE;color:var(--sub)}
.th .mnav span.on{background:var(--acc);border-color:var(--acc);color:var(--acct);font-weight:700}
.th .mk2{background:var(--acc);color:var(--acct);border-radius:var(--rb);padding:8px 10px;margin-bottom:8px}
.th .mk2 b{display:block;font-size:17px;font-family:var(--hf)}
.th .mbar{height:8px;border-radius:var(--rbar);background:#F2F2F2;display:flex;overflow:hidden;margin-bottom:8px}
.th .mbar i:first-child{background:var(--acc);width:45%}
.th .mbar i:last-child{background:var(--stripe);width:25%}

.ce.num{text-align:right;font-weight:700}
.ce.bad{outline:2px solid var(--red)!important;background:#FFF0F0!important}
.xl .c-d{width:136px}.xl .c-s{width:150px}.xl .c-a{width:118px}.xl .c-p{width:118px}.xl .c-st{width:96px}.xl .c-v{width:110px}.xl .c-m{width:180px}
tr.newrow td{background:var(--accs);border-bottom:2px solid var(--accl)}
tr.newrow .ce{border-color:var(--line);background:#fff}
tr.plan .ce{background:transparent}
.mrow.tap{cursor:pointer}

/* ---------- 실제 가계부 ---------- */
a.logo{text-decoration:none;color:inherit}
.navlink{display:block;padding:11px 12px;font-size:15px;color:var(--sub);text-decoration:none}
.navlink:hover{background:var(--accs)}
.mtabs a{flex:0 0 auto;border:1px solid var(--line);background:#fff;padding:7px 14px;font-size:15px;color:var(--sub);text-decoration:none}
.start label,.set label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.start label .mut,.set label .mut{font-weight:400;font-size:12px}
.start input,.start select,.set input,.set select{width:100%;border:1px solid #DAD9D2;padding:11px 12px;font-size:16px;background:#fff}
.start input:focus,.start select:focus,.set input:focus,.set select:focus{outline:2px solid var(--accd);outline-offset:-2px}
.set .btn.wide{margin-top:8px}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.demo{background:var(--acc2);border:1px solid var(--accl);padding:10px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.foot a,.foot .linkb{color:var(--sub);font-size:12px}

/* ---------- 항목 고르기 (대분류 › 중분류 › 항목) ---------- */
.pickbtn{display:block;text-align:left;cursor:pointer;line-height:1.3;background:transparent}
.pickbtn small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.pickbtn .phx{color:var(--sub);font-weight:700}
tr.newrow .pickbtn{background:#fff}
.xl .c-s{width:168px}
.pk{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:10px;margin-top:12px}
.pkcol{border:1px solid var(--line);max-height:380px;overflow:auto;background:#fff}
.pkcol.pkall{grid-column:1/-1}
.pkh{font-size:12px;font-weight:700;color:var(--sub);padding:8px 12px;border-bottom:1px solid var(--line);background:var(--accs);position:sticky;top:0;z-index:1}
.pkcol>button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #F4F4F4;background:#fff;padding:10px 12px;font-size:15px;cursor:pointer}
.pkcol>button:hover{background:var(--accs)}
.pkcol>button.on{background:var(--acc);font-weight:700}
.pkcol>button small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.pkempty{padding:14px 12px;color:var(--muted);font-size:13px}
.pkadd{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.pkadd input{flex:1;min-width:0;border:1px solid var(--line);padding:7px 8px;font-size:14px}
.pkadd button{border:1px solid var(--accl);background:var(--acc2);padding:0 10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
#pkq{width:100%;border:1px solid #DAD9D2;padding:11px 12px;font-size:16px}
#pkq:focus{outline:2px solid var(--accd);outline-offset:-2px}
/* 폰 · 입력 창 안: 단계별 버튼을 위아래로 */
#ov.sheet .pk,.pk.inline{grid-template-columns:1fr}
.pk.inline .pkcol,#ov.sheet .pkcol{max-height:none;border:0}
.pk.inline .pkcol>button,#ov.sheet .pkcol>button{display:inline-block;width:auto;border:1px solid var(--line);margin:0 6px 6px 0;padding:8px 12px}
.pk.inline .pkcol>button small,#ov.sheet .pkcol>button small{display:none}
.pk.inline .pkcol.pkall>button small,#ov.sheet .pkcol.pkall>button small{display:block}
.pk.inline .pkh,#ov.sheet .pkh{position:static;background:none;border:0;padding:4px 0 6px}
.pk.inline .pkadd,#ov.sheet .pkadd{position:static;border:0;padding:0 0 8px}
.mform .pkadd input{padding:8px;font-size:15px}
.pkopen{display:none}
.pk.inline .pkadd:not(.open) input,.pk.inline .pkadd:not(.open) [data-act^="pkadd"],#ov.sheet .pkadd:not(.open) input,#ov.sheet .pkadd:not(.open) [data-act^="pkadd"]{display:none}
.pk.inline .pkadd:not(.open) .pkopen,#ov.sheet .pkadd:not(.open) .pkopen{display:inline-block;border:1px dashed var(--accl);background:#fff;color:var(--sub);padding:7px 12px;font-size:13px;cursor:pointer}
/* ---------- 계정 ---------- */
.acct{font-size:12px;color:var(--sub);margin-bottom:10px;line-height:1.5}
.acct b{color:var(--ink)}
.acct .dot{display:inline-block;width:7px;height:7px;background:var(--green);margin-right:5px;vertical-align:1px}
.acct .dot.wait{background:var(--accd)} .acct .dot.bad{background:var(--red)}
.loginbtn{width:100%;border:1px solid var(--accd);background:var(--acc);padding:10px;font-weight:800;font-size:14px;cursor:pointer;margin-bottom:10px}
.mtabs .mlogin{flex:0 0 auto;border:1px solid var(--accd);background:var(--acc);padding:7px 14px;font-size:15px;font-weight:800}
.invite{display:flex;gap:6px;margin:6px 0}
.invite input{flex:1;min-width:0}
/* ---------- 스드메 견적 ---------- */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
#app.mo .qgrid{grid-template-columns:1fr}
.qcard{border:1px solid var(--line);background:#fff;padding:16px}
.qcard.done{border:2px solid var(--accd)}
.qhead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.qhead input{flex:1;font-size:17px;font-weight:800;border:1px solid transparent;padding:4px 6px}
.qhead input:hover,.qhead input:focus{border-color:var(--line);outline:0}
.qslot{display:grid;grid-template-columns:62px minmax(0,1fr) 88px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.qslot .lb{font-size:14px;font-weight:700}
.qslot input.vn{width:100%;border:1px solid var(--line);padding:7px 8px;font-size:14px}
.qslot .pick2{border:0;background:none;color:var(--sub);font-size:12px;text-decoration:underline;padding:2px 0;cursor:pointer;text-align:left}
.qslot .tg2{grid-column:2/4;font-size:12px;color:var(--muted)}
.rate{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;margin-left:4px;border:1px solid var(--line)}
.rate.lo{background:#E9F7EF;color:var(--green);border-color:#BFE6CF}.rate.mid{background:var(--accs)}.rate.hi{background:#FFF0F0;color:var(--red);border-color:#F6D4D5}
.qex{margin-top:6px}
.qex .row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;font-size:14px}
.qex .row span{flex:1}
.miss{margin-top:8px;font-size:12px;color:var(--sub)}
.miss button{border:1px dashed var(--accl);background:#fff;padding:3px 8px;margin:3px 4px 0 0;font-size:12px;cursor:pointer}
.qsum{margin-top:10px;padding-top:10px;border-top:2px solid var(--ink)}
.qsum .r{display:flex;justify-content:space-between;font-size:14px;color:var(--sub)}
.qsum .t{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;margin-top:4px}
.qsum .t b{font-size:24px}

.distbar .iq{position:absolute;top:0;bottom:0;background:var(--acc2);border-left:2px solid var(--accl);border-right:2px solid var(--accl)}

.distbar .me:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-4px;border:4px solid transparent;border-top-color:var(--red)}
.distbar .lb{position:absolute;top:18px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.vtab td.best{background:var(--accs);font-weight:800}
.vtab table{table-layout:fixed;width:100%}
.vtab td{vertical-align:top}
.vtab td .pv{font-size:15px}
.vtab td.best .pv{font-weight:800}
.vtab td small{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:2px}

.vtab .vn{font-weight:700}
.vlist .it{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:10px 4px;cursor:pointer}
.vlist .it:hover{background:var(--accs)}
.vlist .it small{display:block;color:var(--muted);font-size:12px}

.locked img{width:120px}

  const opt=PAY.map(p=>`<option ${p===S.pay?"selected":""}>${p}</option>`).join("");
  if(m) return `<div class="mform">
    <label>금액 (원)</label><input id="fA" inputmode="numeric" placeholder="예: 1500000">
    <label>어디에 썼어요? <span class="mut" style="font-weight:400">대분류 → 중분류 → 항목</span></label>
    <input type="hidden" id="fS" value="${esc(S.pk.small||"")}"><input id="pkq" placeholder="바로 찾기: 예) 대관료, 스냅" autocomplete="off">
    <div id="pk" class="pk inline">${pkInner()}</div>
    <div class="hint" id="fH">${S.pk.small?hintFor(S.pk.small):""}</div>
    <label>상태</label><div class="seg" id="fSt"><button class="${S.st==="완료"?"on":""}" data-act="st" data-v="완료">냈어요</button><button class="${S.st==="예정"?"on":""}" data-act="st" data-v="예정">낼 예정</button></div>
    <label>결제 수단</label><div class="chips">${PAY.map(p=>`<button class="${p===S.pay?'on':''}" data-act="pay" data-v="${p}">${p}</button>`).join("")}</div>
    <label>날짜</label><input id="fD" type="date" value="${todayISO()}">
    <label>업체</label><input id="fV" placeholder="선택">
    <label>메모</label><input id="fM" placeholder="계약금, 잔금 등">
    <label class="chk" style="margin-top:12px"><input type="checkbox" id="fR" style="width:auto"> 현금영수증 받았어요</label>
    <button class="btn wide" data-act="addexp" style="margin-top:6px">저장</button></div>`;
  return `<div class="card" style="margin-bottom:14px"><div class="form">
    <div><label>날짜</label><input id="fD" type="date" value="${todayISO()}"></div>
    <div><label>항목 (글자 치면 검색)</label><input id="fS" list="catlist" placeholder="예: 스냅"></div>
    <div><label>금액 (원)</label><input id="fA" inputmode="numeric" placeholder="1500000"></div>
    <div><label>결제 수단</label><select id="fP">${opt}</select></div>
    <div><label>상태</label><div class="seg" id="fSt"><button class="${S.st==="완료"?"on":""}" data-act="st" data-v="완료">냈어요</button><button class="${S.st==="예정"?"on":""}" data-act="st" data-v="예정">낼 예정</button></div></div>
    <div><label>업체</label><input id="fV"></div>
    <div><label>메모</label><input id="fM" placeholder="계약금·잔금"></div>
    <div class="last"><label class="chk"><input type="checkbox" id="fR" style="width:auto">현금영수증</label><button class="btn" data-act="addexp">추가</button></div>
  </div><div class="hint" id="fH">항목을 고르면 대분류·중분류와 이 항목 남은 예산이 바로 보여요.</div></div>`;
}
function vExp(){
  const fl=EXP.map((e,i)=>({...e,i})).filter(e=>S.ef==="전체"||(S.ef==="냈어요"?e.st==="완료":e.st==="예정"));
  const tp=sum(EXP.filter(e=>e.st==="완료"),e=>e.a),tq=sum(EXP.filter(e=>e.st==="예정"),e=>e.a);
  const leftOf=s=>{const b=MY[s]||0;return b?b-paid(s)-plan(s):null};
  let body;
  if(S.mode==="pc"){
    const opt=v=>PAY.map(p=>`<option ${p===v?"selected":""}>${p}</option>`).join("");
    const stOpt=v=>`<option value="완료" ${v==="완료"?"selected":""}>냈어요</option><option value="예정" ${v==="예정"?"selected":""}>낼 예정</option>`;
    const newRow=`<tr class="newrow"><td><input class="ce c-d" id="fD" type="date" value="${todayISO()}" data-fk="n-d"></td>
      <td><input type="hidden" id="fS" value="${esc(cat(S.newS)?S.newS:"")}"><button class="ce c-s pickbtn" id="fSbtn" data-act="pick" data-v="new" data-fk="n-s">${cat(S.newS)?`${esc(S.newS)}<small>${esc(cat(S.newS).big)} › ${esc(cat(S.newS).mid)}</small>`:'<span class="phx">+ 항목 고르기</span><small>대분류 › 중분류 › 항목</small>'}</button></td>
      <td><input class="ce c-a num" id="fA" inputmode="numeric" placeholder="금액" data-fk="n-a"></td>
      <td><select class="ce c-p" id="fP" data-fk="n-p">${opt(S.pay)}</select></td>
      <td><select class="ce c-st" id="fStS" data-fk="n-st">${stOpt(S.st)}</select></td>
      <td><input class="ce c-v" id="fV" placeholder="업체" data-fk="n-v"></td>
      <td><input class="ce c-m" id="fM" placeholder="메모" data-fk="n-m"></td>
      <td class="pad"><input type="checkbox" id="fR"></td>
      <td class="pad" colspan="2"><button class="btn" data-act="addexp" style="padding:6px 14px">추가</button></td></tr>`;
    const rows=fl.map(e=>{const c=cat(e.s),l=leftOf(e.s),i=e.i,k=f=>`data-xi="${i}" data-xf="${f}" data-fk="e-${i}-${f}" data-col="x${f}"`;
      return `<tr class="${e.st==="예정"?"plan":""}"><td><input class="ce c-d" type="date" value="${e.d}" ${k("d")}></td>
      <td><button class="ce c-s pickbtn" data-act="pick" data-v="row:${i}" data-fk="e-${i}-s" data-col="xs">${esc(e.s)}<small>${c?esc(c.big)+" › "+esc(c.mid):""}</small></button></td>
      <td><input class="ce c-a num" inputmode="numeric" value="${e.a.toLocaleString()}" ${k("a")}></td>
      <td><select class="ce c-p" ${k("p")}>${opt(e.p)}</select></td>
      <td><select class="ce c-st" ${k("st")}>${stOpt(e.st)}</select></td>
      <td><input class="ce c-v" value="${esc(e.v)}" placeholder="–" ${k("v")}></td>
      <td><input class="ce c-m" value="${esc(e.m)}" ${k("m")}></td>
      <td class="pad"><input type="checkbox" ${e.r?"checked":""} ${k("r")}></td>
      <td class="num pad ${l<0?'red b':''}">${l==null?'<span class="mut">예산 없음</span>':man(l)}</td>
      <td><button class="x" data-act="delexp" data-i="${i}" title="이 줄 지우기">×</button></td></tr>`}).join("");
    body=`<div class="hint" id="fH" style="margin:0 0 8px">칸을 눌러 바로 고치세요. <b>Enter</b>나 <b>↓</b>를 누르면 아래 줄로 내려가요. 맨 위 레몬 줄에서 <b>항목 고르기</b>를 누르고 금액을 적은 뒤 Enter를 누르면 새 지출이 추가돼요.</div>
    <div class="tw"><table class="xl"><thead><tr><th>날짜</th><th>항목</th><th class="num">금액 (원)</th><th>결제 수단</th><th>상태</th><th>업체</th><th>메모</th><th>현금영수증</th><th class="num">이 항목 남은 예산</th><th></th></tr></thead><tbody>${newRow}${rows}</tbody></table></div>`;
  } else {
    const byM={};[...fl].sort((a,b)=>a.d<b.d?1:-1).forEach(e=>{(byM[e.d.slice(0,7)]=byM[e.d.slice(0,7)]||[]).push(e)});
    body='<p class="mut" style="font-size:13px;margin:0 0 4px">줄을 누르면 고칠 수 있어요.</p>'+Object.keys(byM).map(k=>`<div class="mgh"><span>${k.slice(0,4)}년 ${+k.slice(5)}월</span><span>${man(sum(byM[k],e=>e.a))}</span></div><div class="card" style="padding:4px 16px">${byM[k].map(e=>`<div class="mrow tap" data-act="editexp" data-i="${e.i}"><div class="a"><span class="n">${e.s}</span><b>${man(e.a)}</b></div><div class="s"><span>${+e.d.slice(8)}일 · ${e.v||"업체 미정"} · ${e.p}${e.m?" · "+e.m:""}</span>${e.st==="예정"?'<span class="tag y">낼 예정</span>':""}</div></div>`).join("")}</div>`).join("")+fab();
  }
  return `<div class="ph"><h1>지출</h1><p>돈 낼 때마다 <b>한 줄</b>. 계약금·잔금처럼 아직 안 낸 돈은 <b>낼 예정</b>으로 적어 두세요.</p></div>
  <div class="grid g3" style="margin-bottom:14px">
    <div class="card kpi"><div class="l">냈어요</div><div class="v">${man(tp)}</div></div>
    <div class="card kpi"><div class="l">낼 예정</div><div class="v">${man(tq)}</div></div>
    <div class="card kpi hl"><div class="l">전부 합치면</div><div class="v">${man(tp+tq)}</div></div>
  </div>
  <div class="pills">${["전체","냈어요","낼 예정"].map(x=>`<button class="${S.ef===x?'on':''}" data-act="ef" data-v="${x}">${x}</button>`).join("")}<button data-act="sortexp" style="margin-left:auto">날짜순으로 다시 정렬</button></div>
  ${body}${foot()}`;
}


/* ================= 화면: 스드메 견적 ================= */
const SDM=window.OW_SDM||null, VEN=window.OW_VENDORS||null;
const KN={studio:"스튜디오",dress:"드레스",makeup:"메이크업"};
const SLOT={s:"studio",d:"dress",m:"makeup"};
const BASE_ITEM={studio:"기본가격",dress:"(본식+촬영)기본가격",makeup:"(실장)기본가격"};
const MISS=[["studio","원본구매비"],["studio","수정본구매비"],["studio","얼리스타트비"],["dress","헬퍼(본식)"],["dress","헬퍼(촬영)"],["dress","기본 피팅비"],["dress","드레스 지정비"],["makeup","얼리스타트비"]];
const PKG_AREA={all:"전국",gn:"서울(강남)",seoul:"서울(강남외)",bs:"부산",dg:"대구",ic:"인천",gj:"전남광주",dj:"대전",us:"울산",gg:"경기도",gw:"강원도",cc:"충청도",jb:"전북",gs:"경상도",jj:"제주도"};
S.sdmTab=S.sdmTab||"q";S.vk=S.vk||"studio";S.vp=S.vp||"전체";S.vq="";
const itemIdx=(k,n)=>SDM?SDM.items.findIndex(i=>i.k===k&&i.n===n):-1;
const sv=(k,n,rg)=>{if(!SDM)return null;const v=SDM.vals[P.region];const i=itemIdx(k,n);return v&&i>=0?v[rg][i]:null};   // rg: 0하위10 1하위25 2중간 3상위25 4상위10 5평균
function pkgStat(){if(!SDM)return null;const pk=SDM.pkg.sdm,name=PKG_AREA[P.region]||"전국";let i=pk.areas?pk.areas.indexOf(name):-1,fb=false;if(i<0||pk.mid[i]==null||pk.cnt[i]<10){fb=i>0;i=0}
  return{fb,area:pk.areas[i],l10:pk.low10[i],l25:pk.low25[i],mid:pk.mid[i],h25:pk.high25[i],h10:pk.high10[i],cnt:pk.cnt[i]}}
function rateOf(p,lo,hi){if(p==null||p===""||lo==null||hi==null)return"";p=+p;return p<=lo?'<span class="rate lo">싼 편</span>':p>=hi?'<span class="rate hi">비싼 편</span>':'<span class="rate mid">보통</span>'}
const qBase=q=>["s","d","m"].reduce((t,k)=>t+(+(q[k]&&q[k].p)||0),0)-(+q.disc||0);
const qEx=q=>(q.ex||[]).reduce((t,e)=>t+(+e.a||0),0);
const m1=n=>n==null?"–":(Math.round(n*10)/10).toLocaleString("ko-KR")+"만";
function blankQuote(){return{name:"견적 "+(QUOTES.length+1),s:{v:"",p:""},d:{v:"",p:""},m:{v:"",p:""},disc:0,ex:[]}}

function distBar(st,me){
  if(!st||st.l10==null||st.h10==null)return"";
  const lo=Math.min(st.l10,me||st.l10)*0.9,hi=Math.max(st.h10,me||0)*1.05,x=v=>((v-lo)/(hi-lo)*100).toFixed(1)+"%";
  return `<div class="distbar"><div class="iq" style="left:${x(st.l25)};width:calc(${x(st.h25)} - ${x(st.l25)})"></div><div class="md" style="left:${x(st.mid)}"></div>
    ${me?`<div class="me" style="left:${x(me)}">우리 ${m1(me)}</div>`:""}
    <span class="lb" style="left:${x(st.l10)};transform:none">하위10% ${m1(st.l10)}</span><span class="lb" style="left:${x(st.mid)}">중간 ${m1(st.mid)}</span><span class="lb" style="left:${x(st.h10)};transform:translateX(-100%)">상위10% ${m1(st.h10)}</span></div>`;
}
function quoteCard(q,qi){
  const k=(f)=>`data-qi="${qi}" data-qf="${f}" data-fk="q-${qi}-${f}"`;
  const slot=(key,label)=>{const kind=SLOT[key],it=q[key]||{v:"",p:""},bi=BASE_ITEM[kind];
    const lo=sv(kind,bi,1),mid=sv(kind,bi,2),hi=sv(kind,bi,3);
    return `<div class="qslot"><span class="lb">${label}</span><input class="vn" placeholder="업체 이름" value="${esc(it.v||"")}" ${k(key+"v")}>
      <span><input class="ly" style="width:62px" inputmode="decimal" value="${it.p===""||it.p==null?"":it.p}" placeholder="0" ${k(key+"p")}><span class="u">만</span></span>
      <span></span><span class="tg2"><button class="pick2" data-act="vpick" data-qi="${qi}" data-v="${key}">업체 가격표에서 고르기</button>${mid!=null?` · 우리 지역 중간 ${m1(mid)}${rateOf(it.p,lo,hi)}`:""}</span></div>`};
  const base=qBase(q),ex=qEx(q),tot=base+ex,st=pkgStat();
  const have=new Set((q.ex||[]).map(e=>e.k+"|"+e.n));
  const miss=MISS.filter(([kk,n])=>!have.has(kk+"|"+n)&&sv(kk,n,2)!=null);
  return `<div class="qcard ${q.done?"done":""}">
    <div class="qhead"><input value="${esc(q.name)}" ${k("name")}>${q.done?'<span class="tag y">확정</span>':""}<button class="x" data-act="qdel" data-qi="${qi}" title="견적 지우기">×</button></div>
    ${slot("s","스튜디오")}${slot("d","드레스")}${slot("m","메이크업")}
    <div class="qslot"><span class="lb">할인</span><span class="mut" style="font-size:12px">패키지 할인 등 (빼는 금액)</span><span><input class="ly" style="width:62px" inputmode="decimal" value="${q.disc||""}" placeholder="0" ${k("disc")}><span class="u">만</span></span></div>
    <div class="qex"><div class="mgh" style="margin:8px 0 2px"><span>추가금 ${q.ex&&q.ex.length?q.ex.length+"개":""}</span><button class="linkb" data-act="exadd" data-qi="${qi}">+ 추가금 고르기</button></div>
      ${(q.ex||[]).map((e,ei)=>`<div class="row"><span>${KN[e.k]} · ${esc(e.n)}${sv(e.k,e.n,2)!=null?` <span class="mut" style="font-size:12px">(보통 ${m1(sv(e.k,e.n,2))})</span>`:""}</span>
        <span><input class="ly" style="width:58px" inputmode="decimal" value="${e.a===""||e.a==null?"":e.a}" data-qi="${qi}" data-qe="${ei}" data-fk="qe-${qi}-${ei}"><span class="u">만</span></span><button class="x" data-act="exdel" data-qi="${qi}" data-v="${ei}">×</button></div>`).join("")||'<p class="empty" style="padding:2px 0">견적서에 적힌 추가금을 넣어 주세요.</p>'}
      ${miss.length?`<div class="miss">물어봤나요? 자주 붙는 추가금 ${miss.slice(0,5).map(([kk,n])=>`<button data-act="exquick" data-qi="${qi}" data-v="${kk}|${esc(n)}">+ ${n.startsWith(KN[kk])?"":KN[kk]+" "}${esc(n)} · 보통 ${m1(sv(kk,n,2))}</button>`).join("")}</div>`:""}
    </div>
    <div class="qsum"><div class="r"><span>기본가 합${q.disc?" (할인 뺌)":""}</span><span>${m1(base)}</span></div><div class="r"><span>추가금 합</span><span>${m1(ex)}</span></div>
      <div class="t"><span>진짜 총액</span><b>${m1(tot)}</b></div>
      ${st&&st.mid!=null&&base>0?`<div class="mut" style="font-size:12px;margin-top:4px">기본가 합이 ${esc(st.area)} 스드메 패키지 중간값(${m1(st.mid)})보다 ${base>st.mid?`<b class="red">${m1(base-st.mid)} 비싸요</b>`:`<b class="grn">${m1(st.mid-base)} 싸요</b>`}</div>`:""}
      <button class="btn wide ${q.done?"ghost":""}" data-act="qdone" data-qi="${qi}" style="margin-top:10px">${q.done?"확정됨 · 다시 반영하기":"이 견적으로 확정"}</button></div>
  </div>`;
}
function vSdm(){
  const tabs=[["q","내 견적"],["v","업체 가격표"],["x","추가금 미리 보기"]];
  const head=`<div class="ph"><h1>스드메 견적</h1><p>받은 견적을 적으면 <b>추가금까지 더한 진짜 총액</b>과 우리 지역 가격을 같이 보여줘요.${SDM?` <span style="font-size:13px;color:var(--muted)">(남들 가격: 한국소비자원 참가격 ${SDM.asOf} 계약 금액)</span>`:""}</p></div>
    <div class="pills">${tabs.map(([k,l])=>`<button class="${S.sdmTab===k?"on":""}" data-act="sdmtab" data-v="${k}">${l}</button>`).join("")}</div>
    <div class="basis" data-act="basis">남들 가격 기준 <b>${reg().name}</b> ▾</div>`;
  if(!SDM)return head+'<p class="empty">가격 자료를 불러오지 못했어요.</p>'+foot();
  const noRegion=P.region==="all"?'<p class="mut" style="font-size:13px;margin:-4px 0 12px">스튜디오·드레스·메이크업 항목별 가격은 지역을 고르면 보여요. 지금은 전국 패키지 가격만 보여요.</p>':"";
  if(S.sdmTab==="v")return head+vVendors()+foot();
  if(S.sdmTab==="x")return head+noRegion+vExtras()+foot();
  const st=pkgStat(),best=QUOTES.length>1?QUOTES.reduce((b,q,i)=>qBase(q)+qEx(q)<qBase(QUOTES[b])+qEx(QUOTES[b])?i:b,0):-1;
  return head+noRegion+`
  <div class="card" style="margin-bottom:14px"><h2>${esc(st.area)} 스드메 패키지, 남들은 얼마?</h2>
    <p class="mut" style="font-size:13px;margin:0">가운데 진한 칸이 절반의 부부가 낸 가격대(하위 25%~상위 25%)예요. 계약 ${(st.cnt||0).toLocaleString()}건 기준${st.fb?` · ${esc(PKG_AREA[P.region])} 계약 자료가 너무 적어서 전국 가격으로 보여줘요`:st.cnt<30?' · <b class="red">계약 건수가 적어서 참고만 하세요</b>':""}.</p>
    ${distBar(st,QUOTES.length?Math.min(...QUOTES.map(qBase).filter(x=>x>0).concat([Infinity])):0)}
    ${P.region!=="all"?`<div class="mut" style="font-size:13px">항목별 중간값 · 스튜디오 ${m1(sv("studio","기본가격",2))} · 드레스(본식+촬영) ${m1(sv("dress","(본식+촬영)기본가격",2))} · 메이크업(실장) ${m1(sv("makeup","(실장)기본가격",2))}</div>`:""}
  </div>
  ${QUOTES.length>1?`<div class="tw" style="margin-bottom:14px"><table><thead><tr><th>견적</th><th class="num">기본가 합</th><th class="num">추가금</th><th class="num">진짜 총액</th></tr></thead><tbody>
    ${QUOTES.map((q,i)=>`<tr${i===best?' class="plan"':""}><td class="nm">${esc(q.name)}${q.done?' <span class="tag y">확정</span>':""}${i===best?' <span class="tag y">제일 싸요</span>':""}</td><td class="num">${m1(qBase(q))}</td><td class="num">${m1(qEx(q))}</td><td class="num b">${m1(qBase(q)+qEx(q))}</td></tr>`).join("")}
  </tbody></table></div>`:""}

function vRow(v){

  const rep=r=>{const pr=r.pr;const pref=r.k==="studio"?pr[0]:(pr.find(x=>/^본식\+촬영( 실장)?$/.test(x[0]))||pr.find(x=>/^본식\+촬영/.test(x[0]))||pr[0]);return pref};
  return {rep};

// 가격 글자에서 시간·달 숫자를 빼고 가격만 골라 최저~최고로 줄임 ("오전 161 / 오후 172" → 161~172, "264~" → 264~)
function priceOf(x){
  const t=String(x[1]),clean=t.replace(/\d+\s*~\s*\d+\s*월/g,"").replace(/\d+\s*(시|월|분)/g,"");
  const ns=(clean.match(/\d+(?:\.\d+)?/g)||[]).map(Number);if(!ns.length)return{lo:null,hi:null,main:t,more:""};
  const lo=Math.min(...ns),open=/~\s*$/.test(t.trim())&&ns.length===1,hi=open?Infinity:Math.max(...ns);
  const main=open?`${lo}~`:lo===hi?`${lo}`:`${lo}~${hi}`;
  const more=t.replace(/\s+/g,"")===main?"":t.replace(/\s*\/\s*/g," / ").replace(/\s{2,}/g," ");
  return{lo,hi,main,more};
}

function vTodo(){
  const now=stageNow(); const cur=S.stage||now;
  const items=TODO.filter(t=>t[0]===cur);
  const doneN=TODO.filter(isDone).length;
  const uniq=[...new Set(items.map(moneyOf).filter(s=>s&&cat(s)))];
  const sb=sum(uniq,s=>MY[s]||0), sp=sum(uniq,paid), sq=sum(uniq,plan);
  const stageBtn=s=>{const it=TODO.filter(t=>t[0]===s),d=it.filter(isDone).length;const u=[...new Set(it.map(moneyOf).filter(x=>x&&cat(x)))];const mb=sum(u,x=>MY[x]||0),mu=sum(u,x=>paid(x)+plan(x));
    return `<button class="${s===cur?'on':''}" data-act="stage" data-v="${s}"><div class="t"><span>${s} ${s===now?'<span class="tag y">지금</span>':""}</span><span class="mut" style="font-weight:400">${d}/${it.length}</span></div><div class="bar"><i class="p" style="width:${d/it.length*100}%"></i></div>${mb||mu?`<div class="mut" style="font-size:12px;margin-top:4px">${man(mu)} / 예산 ${man(mb)}</div>`:""}</button>`};
  const sumCard=`<div class="grid g3 tsum" style="margin-bottom:12px">
    <div class="card kpi"><div class="l">${cur} 단계 예산</div><div class="v">${man(sb)}</div><div class="s">연결된 항목 ${uniq.length}개</div></div>
    <div class="card kpi"><div class="l">냈어요 · 낼 예정</div><div class="v">${man(sp)} <span style="font-size:15px;color:var(--muted);font-weight:600">+ ${man(sq)}</span></div><div class="s">${bar(sb,sp,sq)}</div></div>
    <div class="card kpi ${sb-sp-sq<0?"warn":"hl"}" style="display:block"><div class="l">${sb-sp-sq<0?"예산 넘음":"남은 돈"}</div><div class="v ${sb-sp-sq<0?"red":""}">${man(Math.abs(sb-sp-sq))}</div><div class="s">이 단계 항목만</div></div></div>`;
  const list=`<div class="card todo">${items.map(t=>{const a=isAuto(t),d=isDone(t);const af=TODO_AFF[t[2]];
    return `<div class="it ${d?'done':''}"><button class="cb ${a?'auto':d?'on':''}" data-act="todo" data-t="${esc(t[2])}" ${a?"disabled":""}>${d?"✔":""}</button>
      <div class="tx"><span>${t[2]}</span><small>${t[1]}${a?" · 냈어요 기록돼서 자동 완료":isPlanned(t)?" · 낼 예정 지출 있음":""}${af&&!d?` · <span class="aff">${af}</span>`:""}</small>${S.mode==="mo"?moneyCell(t,true):""}</div>
      ${S.mode==="pc"?moneyCell(t,false):""}</div>`}).join("")}</div>`;
  const head=`<div class="ph"><h1>할 일</h1><p>체크하면서 옆에서 <b>예산·쓴 돈</b>까지 같이 봐요. 예산 칸을 고치면 예산 탭에도 그대로 반영돼요. 전체 ${TODO.length}개 중 ${doneN}개 끝.</p></div>`;
  if(S.mode==="pc") return head+`<div style="display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start"><div class="stages">${STAGES.map(stageBtn).join("")}</div><div>${sumCard}${list}</div></div>${foot()}`;
  return head+`<div class="pills">${STAGES.map(s=>{const it=TODO.filter(t=>t[0]===s),d=it.filter(isDone).length;return `<button class="${s===cur?'on':''}" data-act="stage" data-v="${s}">${s}<small>${d}/${it.length}</small></button>`}).join("")}</div>${sumCard}${list}${fab()}${foot()}`;
}

function vHall(){
  const tot=HALLS.map(h=>sum(h.sc,x=>+x));
  const rank=tot.map(t=>1+tot.filter(x=>x>t).length);
  const best=rank.indexOf(1);
  const n=s=>parseFloat(String(s).replace(/[^0-9.]/g,""))||0;
  const cost=HALLS.map(h=>n(h.v[4])+n(h.v[6])*n(h.v[8]));
  let body="";let lastG="";
  HALLROWS.forEach((r,ri)=>{
    if(r[0]){lastG=r[0];body+=`<tr class="grp"><td class="st">${r[0]}</td><td></td>${HALLS.map(()=>`<td></td><td></td>`).join("")}</tr>`}
    body+=`<tr><td class="st">${r[1]}</td><td class="best">${r[2]}</td>${HALLS.map((h,k)=>`<td class="v ${k===best?'top':''}"><span contenteditable data-hv="${k},${ri}">${esc(h.v[ri]||"")}</span></td><td class="${k===best?'top':''}"><select data-hs="${k},${ri}">${[1,2,3,4,5].map(x=>`<option ${h.sc[ri]==x?"selected":""}>${x}</option>`).join("")}</select></td>`).join("")}</tr>`;
  });
  body+=`<tr class="sum"><td class="st">점수 합계</td><td></td>${HALLS.map((h,k)=>`<td colspan="2" class="${k===best?'top':''}">${tot[k]}점</td>`).join("")}</tr>`;
  body+=`<tr class="sum"><td class="st">순위</td><td></td>${HALLS.map((h,k)=>`<td colspan="2" class="${k===best?'top':''}">${rank[k]}위 ${k===best?'<span class="tag y">추천</span>':""}</td>`).join("")}</tr>`;
  body+=`<tr class="sum"><td class="st">총 비용</td><td class="best" style="font-weight:400">대관료+식대×보증</td>${HALLS.map((h,k)=>`<td colspan="2" class="${k===best?'top':''}">${cost[k].toLocaleString()}만</td>`).join("")}</tr>`;
  return `<div class="ph"><h1>웨딩홀 비교</h1><p>투어 전에 홀 이름을 적고, 다녀와서 <b>내용과 점수(1~5)</b>만 채우세요. 점수 합이 제일 높은 홀에 표시돼요.</p></div>
  ${S.mode==="mo"?'<p class="mut" style="font-size:13px;margin:-8px 0 10px">표를 옆으로 밀면 다른 홀이 보여요 →</p>':""}
  <div class="tw hall"><table><thead><tr><th class="st">항목</th><th>좋은 기준</th>${HALLS.map((h,k)=>`<th class="${k===best?'top':''}"><input data-hn="${k}" value="${esc(h.name)}"></th><th class="${k===best?'top':''}">점수</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
  ${HALLS.length<5?`<div style="margin-top:12px"><button class="addrow" data-act="addhall">+ 홀 추가 (최대 5곳)</button></div>`:""}
  ${foot()}`;
}

      if(confirm("초대받은 가계부에 들어갈까요?\n들어가면 둘이 같은 가계부를 함께 써요.\n(이 계정에 따로 적던 가계부가 있었다면 초대받은 가계부로 바뀌어요.)")){
        const {error}=await SB.rpc("join_ledger",{p_code:code});
        if(error)alert(/full/.test(error.message)?"이 가계부에는 이미 두 사람이 들어가 있어요.":/invalid/.test(error.message)?"초대 링크가 바뀌었거나 잘못됐어요. 새 링크를 받아 주세요.":"합류하지 못했어요. 다시 시도해 주세요.");
      }}
    let r=await SB.rpc("my_ledger");if(r.error)throw r.error;
    let row=(r.data||[])[0];
    const local=(P.started&&!P.demo)?snapshot():null;
    if(!row){
      const c=await SB.rpc("create_ledger",{p_data:local||fresh()});if(c.error)throw c.error;
      row=((await SB.rpc("my_ledger")).data||[])[0];
    }else if(local&&row.data&&row.data.profile&&row.data.profile.started&&coreOf(local)!==coreOf(row.data)){
      if(confirm("이 계정에 저장된 가계부가 있어요.\n\n[확인] 계정 가계부 불러오기 (이 브라우저 기록은 백업 파일로 내려받아 둘게요)\n[취소] 이 브라우저 기록으로 계정 가계부 덮어쓰기")){
        download(JSON.stringify(local),`ourwedding_이브라우저기록_${todayISO()}.json`,"application/json");
      }else{const w=await SB.rpc("save_ledger",{p_id:row.id,p_data:local});if(!w.error)row.data=local}
    }
    CL.id=row.id;CL.invite=row.invite_code;CL.members=row.members;
    if(row.data&&row.data.v)use(row.data);
    P.demo=false;CL.last=coreOf(snapshot());CL.state="저장됨";
    subscribe();render();
  }catch(e){CL.state="연결 실패 · 이 브라우저에 저장 중";render()}
  finally{_starting=false}
}
function subscribe(){
  if(CL.ch)SB.removeChannel(CL.ch);
  CL.ch=SB.channel("ledger-"+CL.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"ledgers",filter:"id=eq."+CL.id},pl=>{
    const n=pl.new;if(!n||!n.data||!n.data.v)return;const c=coreOf(n.data);if(c===CL.last)return;
    CL.last=c;use(n.data);P.demo=false;CL.state=(CL.user&&n.updated_by&&n.updated_by!==CL.user.id)?"상대가 방금 고쳤어요":"저장됨";render();
  }).subscribe();
}
function cloudSave(){
  if(!SB||!CL.id)return;
  clearTimeout(CL.t);
  CL.t=setTimeout(async()=>{
    const d=snapshot(),c=coreOf(d);if(c===CL.last)return;
    setState("저장 중");
    const {error}=await SB.rpc("save_ledger",{p_id:CL.id,p_data:d});
    if(error){setState("저장 실패 · 다시 시도 중");setTimeout(cloudSave,5000);return}
    CL.last=c;setState("저장됨");
  },800);
}
async function signOutAll(){try{if(CL.ch)SB.removeChannel(CL.ch);await SB.auth.signOut()}catch(e){}CL.user=null;CL.id=null;CL.ch=null;try{localStorage.removeItem(KEY)}catch(e){}use(fresh());S.view="home";render();window.scrollTo(0,0)}

/* ================= 이벤트 ================= */
function toast(t){const h=document.querySelector("#dlg #fH")||document.getElementById("fH");if(h)h.innerHTML=t}
function readExp(){
  const g=id=>document.querySelector("#dlg #"+id)||document.getElementById(id);
  const s=g("fS").value.trim(),am=parseInt((g("fA").value||"").replace(/[^0-9]/g,""));
  if(!cat(s)){toast('<span class="red">어디에 쓴 돈인지 대분류 › 중분류 › 항목을 골라 주세요.</span>');const b=g("fSbtn");if(b)b.focus();return null}
  if(!am){toast('<span class="red">금액을 적어 주세요.</span>');g("fA").focus();return null}
  const pSel=g("fP"),stSel=g("fStS");
  return {d:g("fD").value||todayISO(),s,a:am,p:pSel?pSel.value:S.pay,st:stSel?stSel.value:S.st,v:g("fV").value,m:g("fM").value,r:g("fR").checked};
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){const v=g.dataset.go;S.view=v;S.stage=null;closeDlg();render();window.scrollTo(0,0);return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const v=a.dataset.v;
  switch(a.dataset.act){
    case"big":S.big=v;render();break;
    case"basis":dlgBasis();break;
    case"setr":P.region=v;closeDlg();render();break;
    case"close":closeDlg();if(S.view==="sdm")render();break;
    case"ef":S.ef=v;render();break;
    case"st":S.st=v;document.querySelectorAll("#fSt button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));break;
    case"pay":S.pay=v;a.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===a));break;
    case"mexp":S.pkTarget="form";pkFrom(cat(S.newS)?S.newS:"");openDlg(`<h3>지출 적기</h3>`+expForm(true),true);break;
    case"texp":{S.pkTarget="form";pkFrom(a.dataset.s);openDlg(`<h3>지출 적기</h3>`+expForm(true),S.mode==="mo");document.getElementById("fA").focus();break;}
    case"pick":dlgPick(v==="new"||v==="cat"?v:v,v==="new"?S.newS:v.startsWith("row:")?(EXP[+v.slice(4)]||{}).s:"");break;
    case"pkbig":{S.pk={big:v,mid:null,small:null};const ms=[...new Set(CATS.filter(c=>c.big===v).map(c=>c.mid))];if(ms.length===1)S.pk.mid=ms[0];pkClearForm();pkRefresh();break;}
    case"pkmid":S.pk.mid=v;S.pk.small=null;pkClearForm();pkRefresh();break;
    case"pksm":pkChoose(v);break;
    case"pkopen":{const box=a.closest(".pkadd");box.classList.add("open");const i=box.querySelector("input");if(i)i.focus();break;}
    case"pkaddbig":case"pkaddmid":case"pkaddsm":pkAdd(a.dataset.act);break;
    case"delcat":{const c=CATS.find(x=>String(x.id)===a.dataset.id);if(!c)break;const n=EXP.filter(x=>x.s===c.small).length;
      if(n){alert(`'${c.small}' 항목으로 적은 지출이 ${n}건 있어요. 그 지출의 항목을 먼저 바꿔 주세요.`);break}
      if(!confirm(`직접 만든 '${c.small}' 항목을 지울까요?`))break;CATS.splice(CATS.indexOf(c),1);delete MY[c.small];if(S.newS===c.small)S.newS="";render();break;}
    case"addexp":{const x=readExp();if(!x)return;S.pay=x.p;S.st=x.st;EXP.unshift(x);const inDlg=!!a.closest("#dlg");closeDlg();S.focusNew=!inDlg;render();toast(`<b>${x.s} ${man(x.a)}</b> 추가했어요. 홈·예산·할일에 바로 반영됐어요.`);break;}
    case"saveexp":{const x=readExp();if(!x)return;Object.assign(EXP[+a.dataset.i],x);closeDlg();render();break;}
    case"editexp":{const i=+a.dataset.i,e=EXP[i];S.st=e.st;S.pay=e.p;S.pkTarget="form";pkFrom(e.s);openDlg(`<h3>지출 고치기</h3>`+expForm(true),true);
      const set=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v};set("fA",e.a.toLocaleString());set("fS",e.s);set("fD",e.d);set("fV",e.v);set("fM",e.m);document.getElementById("fR").checked=e.r;
      const b=document.querySelector('#dlg [data-act="addexp"]');b.dataset.act="saveexp";b.dataset.i=i;b.textContent="고치기";
      b.insertAdjacentHTML("afterend",`<button class="btn wide" data-act="delexp2" data-i="${i}" style="position:static;box-shadow:none;margin-top:8px;background:#fff;border:1px solid var(--line);color:var(--red)">이 지출 지우기</button>`);break;}
    case"delexp":EXP.splice(+a.dataset.i,1);render();break;
    case"delexp2":EXP.splice(+a.dataset.i,1);closeDlg();render();break;
    case"sortexp":EXP.sort((x,y)=>x.d<y.d?1:-1);render();break;
    case"addcat":{const id=CATS.length;const idx=CATS.map(c=>c.mid===a.dataset.mid&&c.big===a.dataset.big).lastIndexOf(true);CATS.splice(idx+1,0,{id:Date.now(),big:a.dataset.big,mid:a.dataset.mid,small:"새 항목 "+(CATS.filter(c=>c.custom).length+1),avg:null,custom:true});render();break;}
    case"gt":{const g=GUESTS[+a.dataset.i];g[a.dataset.k]=!g[a.dataset.k];render();break;}
    case"gside":S.gside=v;S.gshow=15;render();break;
    case"gmore":S.gshow+=30;render();break;
    case"addg":{const n=document.getElementById("gN").value.trim();if(!n)return;GUESTS.unshift({name:n,side:document.getElementById("gS").value,prev:false,inv:false,close:false,plus:0,memo:"",aDay:0,aGift:0,aHow:""});S.gside="전체";render();break;}
    case"todo":{const t=a.dataset.t;DONE.has(t)?DONE.delete(t):DONE.add(t);render();break;}
    case"stage":S.stage=v;render();break;
    case"start":{P.wed=document.getElementById("stW").value;P.region=document.getElementById("stR").value;P.bride=document.getElementById("stB").value.trim();P.groom=document.getElementById("stG").value.trim();P.started=true;P.demo=false;render();window.scrollTo(0,0);break;}
    case"demo":use(demoData());S.view="home";render();window.scrollTo(0,0);break;
    case"enddemo":if(confirm("예시를 지우고 빈 가계부로 시작할까요?")){use(fresh());S.view="home";render();window.scrollTo(0,0)}break;
    case"login":dlgLogin(false);break;
    case"oauth":if(v==="naver"){location.href=CONF.supabaseUrl+"/functions/v1/naver-login?redirect="+encodeURIComponent(location.origin+location.pathname);break}
      SB.auth.signInWithOAuth({provider:v,options:{redirectTo:location.origin+location.pathname}});break;
    case"copyinv":{const l=inviteLink();(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>setMsg("초대 링크를 복사했어요. 카톡으로 보내 주세요."),()=>{const i=document.getElementById("invLink");i.select();document.execCommand("copy");setMsg("초대 링크를 복사했어요.")});break;}
    case"newinv":(async()=>{const {data,error}=await SB.rpc("new_invite_code",{p_id:CL.id});if(!error){CL.invite=data;render();setMsg("새 링크를 만들었어요. 예전 링크는 이제 못 써요.")}})();break;
    case"logout":if(confirm("로그아웃할까요? 이 기기에서는 기록이 지워지고, 다시 로그인하면 불러와요."))signOutAll();break;
    case"delme":if(confirm("탈퇴하면 계정과 가계부 기록이 바로 지워져요. 같이 쓰던 상대의 가계부는 남아요.\n탈퇴할까요?")&&confirm("되돌릴 수 없어요. 정말 탈퇴할까요?")){(async()=>{const {error}=await SB.rpc("delete_me");if(error){alert("탈퇴하지 못했어요. 다시 시도해 주세요.");return}await signOutAll();alert("탈퇴했어요. 그동안 써 주셔서 고마워요.")})()}break;
    case"sdmtab":S.sdmTab=v;render();break;
    case"vk":S.vk=v;render();break;
    case"vp":S.vp=v;render();break;
    case"qadd":QUOTES.push(blankQuote());render();break;
    case"qdel":if(confirm("이 견적을 지울까요?")){QUOTES.splice(+a.dataset.qi,1);render()}break;
    case"qdone":confirmQuote(+a.dataset.qi);break;
    case"exadd":dlgExtras(+a.dataset.qi);break;
    case"exdel":QUOTES[+a.dataset.qi].ex.splice(+v,1);render();break;
    case"exquick":case"extoggle":{const q=QUOTES[+a.dataset.qi];q.ex=q.ex||[];const [kk,...nn]=v.split("|");const n=nn.join("|");const i=q.ex.findIndex(e=>e.k===kk&&e.n===n);
      if(i>=0&&a.dataset.act==="extoggle"){q.ex.splice(i,1);a.classList.remove("on")}else if(i<0){q.ex.push({k:kk,n,a:sv(kk,n,2)??""});a.classList.add("on")}
      if(a.dataset.act==="exquick")render();else save();break;}
    case"vpick":dlgVendorPick(+a.dataset.qi,v);break;
    case"vset":{const [vn,pl,pr]=v.split("|");const q=QUOTES[S.vpick.qi],slot=q[S.vpick.key]=q[S.vpick.key]||{};slot.v=vn;if(pr!=="")slot.p=+pr;if(!q.name||/^견적 \d+$/.test(q.name))q.name=pl+" 견적";closeDlg();render();break;}
    case"backup":download(JSON.stringify(snapshot()),`ourwedding_백업_${todayISO()}.json`,"application/json");setMsg("백업 파일을 내려받았어요. 카톡 나에게 보내기나 드라이브에 올려 두면 안전해요.");break;
    case"restore":document.getElementById("restoreFile").click();break;
    case"csv":csv(v);setMsg("엑셀에서 열 수 있는 파일(CSV)을 내려받았어요.");break;
    case"wipe":if(confirm("정말 모든 기록을 지울까요? 되돌릴 수 없어요.")&&confirm("백업 파일이 없으면 복구할 수 없어요. 그래도 지울까요?")){try{localStorage.removeItem(KEY)}catch(e){}use(fresh());S.view="home";render();window.scrollTo(0,0)}break;
    case"addhall":HALLS.push({name:"홀 "+(HALLS.length+1)+" 이름",v:HALLROWS.map(()=>""),sc:HALLROWS.map(()=>3)});render();break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.bud!=null){const n=parseFloat(t.value.replace(/,/g,""));MY[t.dataset.bud]=isNaN(n)?0:Math.round(n*10000);later();}
  else if(t.dataset.xf!=null){const e=EXP[+t.dataset.xi],f=t.dataset.xf;
    if(f==="s"){const v=t.value.trim();if(!cat(v)){t.classList.add("bad");toast('<span class="red">목록에 있는 항목만 쓸 수 있어요. 글자를 치면 찾아줘요.</span>');t.value=e.s;setTimeout(()=>t.classList.remove("bad"),1500);return}e.s=v}
    else if(f==="a"){const n=parseInt(t.value.replace(/[^0-9]/g,""));if(!n){t.value=e.a.toLocaleString();return}e.a=n}
    else if(f==="r")e.r=t.checked; else e[f]=t.value;
    later();}
  else if(t.dataset.gf!=null){const g=GUESTS[+t.dataset.gi],f=t.dataset.gf;
    if(f==="plus"||f==="day")g[f]=parseInt(t.value)||0; else if(f==="gift")g.gift=parseInt(t.value.replace(/[^0-9]/g,""))||0; else g[f]=t.value;
    later();}
  else if(t.dataset.ren!=null){const c=CATS.find(c=>c.id==t.dataset.ren);const old=c.small,nv=t.value.trim();
    if(!nv||nv===old){t.value=old;return}
    if(cat(nv)){alert(`'${nv}' 항목이 이미 있어요. 다른 이름을 적어 주세요.`);t.value=old;return}
    c.small=nv;if(MY[old]!=null){MY[nv]=MY[old];delete MY[old]}EXP.forEach(x=>{if(x.s===old)x.s=nv});if(S.newS===old)S.newS=nv;render();}
  else if(t.dataset.hs!=null){const[k,r]=t.dataset.hs.split(",");HALLS[k].sc[r]=+t.value;render();}
  else if(t.dataset.hn!=null){HALLS[+t.dataset.hn].name=t.value;save();}
  else if(t.dataset.pf!=null){P[t.dataset.pf]=t.value;later();}
  else if(t.dataset.qf!=null){const q=QUOTES[+t.dataset.qi],f=t.dataset.qf;
    if(f==="name")q.name=t.value.trim()||q.name;else if(f==="disc")q.disc=parseFloat(t.value.replace(/,/g,""))||0;
    else{const slot=q[f[0]]=q[f[0]]||{};if(f[1]==="v")slot.v=t.value.trim();else slot.p=t.value===""?"":(parseFloat(t.value.replace(/,/g,""))||0)}
    later();}
  else if(t.dataset.qe!=null){const e=QUOTES[+t.dataset.qi].ex[+t.dataset.qe];e.a=t.value===""?"":(parseFloat(t.value.replace(/,/g,""))||0);later();}
  else if(t.id==="restoreFile"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||d.v!==1||!Array.isArray(d.exp)||!Array.isArray(d.cats))throw 0;
      if(!confirm("지금 기록을 이 백업 파일 내용으로 바꿀까요?"))return;use(d);P.started=true;P.demo=false;S.view="home";render();window.scrollTo(0,0);}catch(err){setMsg('<span class="red">OUR WEDDING 백업 파일이 아니에요.</span>')}};fr.readAsText(t.files[0]);t.value="";}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="pkq"){S.pkq=t.value;pkRefresh();return}
  if(t.id==="vq"){S.vq=t.value;clearTimeout(S._vq);S._vq=setTimeout(()=>{render();const e=document.getElementById("vq");if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},250);return}
  if(t.id==="vpq"&&S.vpDraw){S.vpDraw();return}
  if(t.id==="fS"){const c=cat(t.value.trim());if(c){const b=MY[c.small]||0,l=b-paid(c.small)-plan(c.small);toast(`<b>${c.big} · ${c.mid}</b> 항목이에요. ${b?`이 항목 남은 예산 <b class="${l<0?'red':''}">${man(l)}</b>`:"아직 예산을 안 적었어요"}${avgOf(c)!=null?` · 남들 평균 ${man(avgOf(c))}`:""}`)}}
  if(t.dataset.hv!=null){}
});
document.addEventListener("focusout",e=>{const t=e.target;if(t.dataset&&t.dataset.hv!=null){const[k,r]=t.dataset.hv.split(",");HALLS[k].v[r]=t.textContent;render();}});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeDlg();return}
  const t=e.target;if(!t||!t.dataset)return;
  if(e.key==="Enter"&&t.dataset.pkadd){e.preventDefault();pkAdd(t.dataset.pkadd);return}
  if(e.key==="Enter"&&t.id==="pkq"){e.preventDefault();const f=document.querySelector('#pk [data-act="pksm"]');if(f)f.click();return}
  if(e.key==="Enter"&&t.classList&&t.classList.contains("pickbtn"))return;
  if(e.key==="Enter"&&t.closest&&t.closest("tr.newrow")){e.preventDefault();document.querySelector('tr.newrow [data-act="addexp"]').click();return}
  const col=t.dataset.col;if(!col){if(e.key==="Enter"&&t.classList.contains("ly"))t.blur();return}
  let dir=0;if(e.key==="Enter")dir=e.shiftKey?-1:1;else if(e.key==="ArrowDown")dir=1;else if(e.key==="ArrowUp")dir=-1;else return;
  if(e.key!=="Enter"&&(t.tagName==="SELECT"||t.type==="date"))return;
  e.preventDefault();
  const scope=t.closest("table")||document.getElementById("main");
  const all=[...scope.querySelectorAll(`[data-col="${col}"]`)];const n=all[all.indexOf(t)+dir];
  if(n){n.focus();try{n.select()}catch(e){}}else t.blur();
});

addEventListener("resize",()=>{const m=innerWidth<760?"mo":"pc";if(m!==S.mode){S.mode=m;render()}});
addEventListener("storage",e=>{if(e.key===KEY&&e.newValue){try{use(JSON.parse(e.newValue));render()}catch(err){}}});
render();
cloudInit();
