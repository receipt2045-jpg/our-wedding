function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function ago(iso){ const d=new Date(iso), s=(Date.now()-d)/1000;

function inline(s){

    .replace(/\[([^\]]+)\]\(([a-z]+\.html(?:[?#][\w=&%-]*)?)\)/g, '<a href="$2">$1</a>');

function md(src){
  const L = String(src||"").split("\n"); let h = "", i = 0;
  while(i < L.length){
    const l = L[i];
    if(/^\|.*\|$/.test(l.trim())){ const rows=[]; while(i<L.length && /^\|.*\|$/.test(L[i].trim())){ rows.push(L[i].trim().slice(1,-1).split("|").map(x=>x.trim())); i++; }

    if(/^- /.test(l)){ let u=""; while(i<L.length && /^- /.test(L[i])){ const [a,b]=L[i].slice(2).split(" — 💡 "); u+="<li>"+inline(a)+(b?'<span class="tp">💡 '+inline(b)+"</span>":"")+"</li>"; i++; } h+="<ul>"+u+"</ul>"; continue; }
    if(/^### /.test(l)) h += "<h3>"+inline(l.slice(4))+"</h3>";
    else if(/^\d\) /.test(l)){ const m=l.match(/^(\d)\) (.*)$/); h += m[2].length<28 && !/[.!?요다]$/.test(m[2]) ? "<h4><b>"+m[1]+"</b>"+inline(m[2])+"</h4>" : "<p><b>"+m[1]+")</b> "+inline(m[2])+"</p>"; }
    else if(l.trim()) h += "<p>"+inline(l)+"</p>";
    i++;
  }
  return h;
}

// ---------- 가이드 글을 카드 여러 장으로 (한 장에 한 가지) ----------
const CAT_IC = {"용어":"book","처음":"start","인사":"mail","웨딩홀":"hall","스드메":"camera","혼주":"hanbok","예물":"ring","본식":"mic","혼수":"sofa"};
const KW_IC = [[/만\s?원|비용|돈|예산|가격|금액|할인|캐시백|추가금/,"won"],[/보증 인원|하객|명단|사람|가족|친구|지인|부모님/,"users"],[/식사|식당|밥|식대|뷔페|음식|한정식|코스/,"utensils"],[/조심|주의|바가지|후회|실수|폭탄|금지/,"alert"],[/촬영|사진|스냅|DVD|앨범/,"camera"],[/반지|밴드|각인/,"ring"],[/선물|답례|넥타이|꽃다발/,"gift"],[/청첩장|모청|초대/,"mail"],[/드레스|한복|예복|턱시도|메이크업|헤어/,"hanbok"],[/가전|가구|침대|에어컨|TV|인테리어|신혼집/,"sofa"],[/웨딩홀|홀 투어|예식장|베뉴/,"hall"],[/계산|합계|평균/,"calc"]];
const slideIcon = (txt, cat) => { for(const [re, ic] of KW_IC) if(re.test(txt)) return ic; return CAT_IC[cat] || "book"; };
// 금액·퍼센트·인원 같은 숫자는 노란 밑줄
const hiNum = h => h.replace(/(\d[\d,.~]*\s?(?:만\s?원|원|%|명|개월|주|시간|벌|곳|장|분|대|평|부|통)(?:\s?(?:이상|이내|정도|내외|선))?)/g, "<mark>$1</mark>");
const sents = t => (t.match(/[^.!?]+[.!?]+["”’)\]]*\s*|[^.!?]+$/g) || [t]).map(x => x.trim()).filter(Boolean);
function splitSlides(body){
  const L = String(body || "").split("\n"), out = []; let cur = null, i = 0;
  const push = () => { if(cur && (cur.h || cur.lead || cur.ps.length || cur.items.length || cur.table)) out.push(cur); cur = null; };
  const fresh = (o) => Object.assign({h:null, lead:null, ps:[], items:[], table:null}, o || {});
  const paraSlides = (t, h) => {          // 긴 문단은 두 문장씩 끊어서 여러 장으로
    const ss = sents(t), groups = []; let g = [];
    ss.forEach(s => { if(g.length && (g.length >= 2 || g.join(" ").length + s.length > 110)){ groups.push(g); g = []; } g.push(s); });
    if(g.length) groups.push(g);
    groups.forEach((gr, j) => { const lead = gr[0].length <= 80 ? gr[0] : null; out.push(fresh({h: j === 0 ? h : null, lead, ps: lead ? gr.slice(1) : gr})); });
  };
  while(i < L.length){
    const l = L[i].trim();
    if(!l){ i++; continue; }
    if(/^\|.*\|$/.test(l)){ const rows = []; while(i < L.length && /^\|.*\|$/.test(L[i].trim())){ rows.push(L[i].trim().slice(1, -1).split("|").map(x => x.trim())); i++; }
      const h = cur && cur.h && !cur.ps.length && !cur.items.length ? cur.h : (cur && cur.lead && !cur.ps.length && cur.lead.length < 40 ? cur.lead : "한눈에 보기");
      if(cur && (cur.h === h || cur.lead === h) && !cur.ps.length && !cur.items.length) cur = null; else push();
      out.push(fresh({h, table: rows})); continue; }
    if(/^### /.test(l)){ push(); cur = fresh({h: l.slice(4)}); i++; continue; }
    if(/^- /.test(l)){ if(!cur) cur = fresh(); cur.items.push(l.slice(2)); i++; continue; }
    const m = l.match(/^(\d)\) (.*)$/);
    if(m){ push(); const t = m[2];
      if(t.length < 28 && !/[.!?요다]$/.test(t)) cur = fresh({h: t});
      else if(t.includes(" : ")){ const [a, ...b] = t.split(" : "); out.push(fresh({h: a, ps: [b.join(" : ")]})); }
      else paraSlides(t, null);
      i++; continue; }
    // 일반 문단
    if(cur && cur.h && !cur.ps.length && !cur.items.length && l.length <= 160){ cur.ps.push(l); push(); i++; continue; }
    if(cur && cur.h && !cur.ps.length && !cur.items.length){ const h = cur.h; cur = null; paraSlides(l, h); i++; continue; }
    push(); paraSlides(l, null); i++;
  }
  push();
  // 목록이 길면 6개씩 나눔
  const res = [];
  out.forEach(s => { if(s.items.length > 6){ for(let k = 0; k < s.items.length; k += 6) res.push(Object.assign({}, s, {items: s.items.slice(k, k + 6), h: (s.h || "") + (k ? " (이어서)" : ""), ps: k ? [] : s.ps})); } else res.push(s); });
  return res;
}
let RD = null;                            // {p, sl:[...], i}
function slideHTML(s, k, n, p){
  const txt = [s.h, s.lead, ...s.ps, ...s.items].join(" ");
  const ic = window.OWNAV ? OWNAV.ic(slideIcon(txt, p.cat)) : "";
  const tbl = s.table ? `<div class="tw"><table><thead><tr>${s.table[0].map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${s.table.slice(1).map(r => `<tr>${r.map(c => `<td>${hiNum(inline(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : "";
  const items = s.items.length ? `<ul>${s.items.map(x => { const [a, b] = x.split(" — 💡 "); return `<li>${hiNum(inline(a))}${b ? `<span class="tp">💡 ${hiNum(inline(b))}</span>` : ""}</li>`; }).join("")}</ul>` : "";
  return `<div class="sl"><div class="sh"><span class="ico">${ic}</span><span class="num">${k + 1} / ${n}</span></div>
    ${s.h ? `<h4>${inline(s.h)}</h4>` : ""}${s.lead ? `<p class="lead">${hiNum(inline(s.lead))}</p>` : ""}${s.ps.map(x => `<p>${hiNum(inline(x))}</p>`).join("")}${items}${tbl}</div>`;
}
function endHTML(p){
  return `<div class="sl end"><div class="sh"><span class="num">마지막 장</span></div>
    ${p.tip ? `<p class="lbl">한마디</p><h4>${esc(p.tip)}</h4>` : `<h4>${esc(p.title)}</h4>`}
    ${heartBtn(p)}${goBox(p)}</div>`;
}
function drawRD(){
  if(!RD) return; const n = RD.sl.length + 1, i = RD.i, box = $("rdbox"); if(!box) return;
  box.innerHTML = i < RD.sl.length ? slideHTML(RD.sl[i], i, n, RD.p) : endHTML(RD.p);
  document.querySelectorAll("#rdprog i").forEach((x, j) => x.classList.toggle("on", j <= i));
  const pv = $("rdpv"), nx = $("rdnx"), last = i === n - 1;
  pv.disabled = i === 0;
  nx.innerHTML = last ? (RD.next ? "다음 글 ›" : "목록으로") : "다음 ›";
  $("rdcnt").textContent = (i + 1) + " / " + n;
}
function rdMove(d){
  if(!RD) return; const n = RD.sl.length + 1, j = RD.i + d;
  if(j >= n){ return RD.next ? go({p: RD.next.id}) : go({p: null}); }
  if(j < 0) return;
  RD.i = j; drawRD();
  const r = $("rd"); if(r && r.getBoundingClientRect().top < 60) r.scrollIntoView({block: "start"});
}
function readerHTML(p, next){
  const sl = splitSlides(p.body); RD = {p, sl, i: 0, next};
  const n = sl.length + 1;
  return `<div class="rd" id="rd"><div class="prog" id="rdprog">${Array.from({length: n}, (_, j) => `<i class="${j ? "" : "on"}"></i>`).join("")}</div>
    <div id="rdbox"></div>
    <div class="rnav"><button class="btn" id="rdpv" data-act="sp" disabled>‹ 이전</button><span id="rdcnt" class="cnt"></span><button class="btn k" id="rdnx" data-act="sn">다음 ›</button></div>
    <div class="rall"><button data-act="sall">한 번에 다 보기</button><span class="kb">← → 키나 옆으로 밀어서 넘겨요</span></div></div>`;
}

async function vPost(){
  const [p, cs] = await Promise.all([getPost(S.p), getComments(S.p)]);
  if(!p) return `<div class="empty">없는 글이거나 숨겨진 글이에요. <button class="btn s" data-act="list">목록으로</button></div>`;
  if(p.board !== S.b){ S.b = p.board; document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.b===S.b)); }
  document.title = p.title + " · OUR WEDDING";
  CUR = {k:"guide:"+p.id, t:p.title, s:(p.board==="guide"?"가이드 · "+catName(p.cat):"묻고 답하기 · "+(p.cat||"기타")), u:"board.html?p="+p.id, i:p.board==="guide"?"book":"chat"};
  if(window.OWNAV) OWNAV.track(CUR);
  const mine = U.user && p.user_id === U.user.id, isG = p.board==="guide";
  const GL = isG ? await guideAll() : [], gi = GL.findIndex(x=>x.id===p.id), GN = {a: GL[gi-1], b: GL[gi+1]};
  if(!isG) RD = null;
  let h = `<div class="crumb"><button data-act="list">${isG?"결혼 준비 가이드":"묻고 답하기"}</button> › ${esc(isG?catName(p.cat):(p.cat||"기타"))}${isG&&p.grp?" › "+esc(p.grp):""}</div>
  <h1 class="pt">${p.hidden?"[숨김] ":""}${esc(p.title)}</h1>
  <div class="pm">${isG?"":who(p.nick || "OUR WEDDING")}${isG?"":`<span>${ago(p.created_at)}</span>`}${p.updated_at && p.created_at && (new Date(p.updated_at)-new Date(p.created_at))>60000 && !isG?"<span>수정됨</span>":""}
    <span class="acts">${(mine||U.admin)?`<button class="btn s" data-act="edit" data-v="${p.id}">수정</button>`:""}${(mine&&!p.comment_count)||U.admin?`<button class="btn s" data-act="delpost" data-v="${p.id}">삭제</button>`:""}${U.admin&&!isG?`<button class="btn s" data-act="hidepost" data-v="${p.id}" data-h="${p.hidden?0:1}">${p.hidden?"숨김 풀기":"숨기기"}</button>`:""}${!mine&&!isG&&U.user?`<button class="btn s" data-act="report" data-k="post" data-v="${p.id}">신고</button>`:""}</span></div>
  ${isG ? readerHTML(p, GN.b) : '<div class="ubody">'+esc(p.body)+"</div>"+(p.tip?`<div class="tipbox"><b>한마디</b> · ${esc(p.tip)}</div>`:"")+heartBtn(p)}`;
  if(isG){ const a = GN.a, b = GN.b;
    h += `<div class="pn">${a?`<button data-post="${a.id}">‹ 이전 글<b>${esc(a.title)}</b></button>`:"<span></span>"}${b?`<button data-post="${b.id}">다음 글 ›<b>${esc(b.title)}</b></button>`:"<span></span>"}</div>`; }
  h += `<section class="cm"><h2>${isG?"댓글":"답변"} ${cs.filter(c=>!c.hidden).length}</h2>`;
  h += cs.length ? cs.map(c=>{ const cm = U.user && c.user_id===U.user.id;
    return `<div class="c${c.hidden?" hid":""}"><div class="h">${who(c.nick)}<span>${ago(c.created_at)}</span>${cm||U.admin?`<button class="btn s" data-act="delc" data-v="${c.id}">삭제</button>`:""}${U.admin?`<button class="btn s" data-act="hidec" data-v="${c.id}" data-h="${c.hidden?0:1}">${c.hidden?"숨김 풀기":"숨기기"}</button>`:""}${!cm&&U.user&&c.nick!=="OUR WEDDING"?`<button class="btn s" data-act="report" data-k="comment" data-v="${c.id}">신고</button>`:""}</div><div class="b">${c.hidden?"숨겨진 "+(isG?"댓글":"답변")+"이에요.":esc(c.body)}</div></div>`; }).join("")
    : `<p style="color:var(--muted);font-size:14px">${isG?"궁금한 점이나 내 경험을 남겨 주세요.":"아직 답변이 없어요. 아는 만큼 알려 주세요."}</p>`;
  h += U.user ? `<div class="cbox"><textarea id="cbody" maxlength="1000" placeholder="${isG?"댓글을 남겨 주세요":"답변을 남겨 주세요"}. 다른 사람이 상처받는 말, 광고는 지워져요."></textarea><div class="r"><span>${U.admin?"OUR WEDDING 이름으로 올라가요":esc(U.nick?U.nick+" 이름으로 올라가요":"닉네임을 먼저 정해요")}</span><button class="btn y" data-act="comment">${isG?"댓글":"답변"} 남기기</button></div></div>`
    : `<div class="gate" style="margin-top:14px"><span>로그인하면 ${isG?"댓글":"답변"}을 남길 수 있어요.</span><button class="btn y" data-act="login">구글로 로그인</button></div>`;
  h += "</section>";
  if(!isG) return h;
  const cnt = c => GL.filter(x=>x.cat===c).length;
  return `<div class="gpost"><nav class="gcats" aria-label="분야">${CATS.map(([k,n])=>`<button data-cat="${k}" class="${k===p.cat?"on":""}">${window.OWNAV?OWNAV.ic(CAT_IC[k]||"book"):""}${n}<small>${cnt(k)}</small></button>`).join("")}</nav><div>${h}</div></div>`;
}

async function vWrite(){
  if(!U.user){ setTimeout(askLogin,0); return `<div class="empty">로그인하면 글을 쓸 수 있어요.</div>`; }
  const isG = S.b==="guide", id = S.w!=="new" ? +S.w : null;
  if(isG && !U.admin) return `<div class="empty">가이드는 운영자만 쓸 수 있어요.</div>`;
  if(!U.admin && !U.nick){ setTimeout(nickDlg,0); }
  let p = {cat: isG?"처음":"웨딩홀", grp:"", title:"", body:"", tip:""};
  if(id){ const x = await getPost(id); if(!x) return `<div class="empty">없는 글이에요.</div>`; p = x; }
  const cats = isG ? CATS.map(c=>c[0]) : QCATS;
  return `<div class="crumb"><button data-act="list">${isG?"결혼 준비 가이드":"묻고 답하기"}</button> › ${id?"글 고치기":isG?"가이드 쓰기":"질문하기"}</div>
  <div class="f" id="wf">
    <label>분야<select id="wcat">${cats.map(c=>`<option value="${esc(c)}"${p.cat===c?" selected":""}>${esc(isG?catName(c):c)}</option>`).join("")}</select></label>
    ${isG?`<label>소분류 (예: 상견례, 드레스)<input id="wgrp" maxlength="40" value="${esc(p.grp||"")}"></label>`:""}
    <label>제목<input id="wtitle" maxlength="80" value="${esc(p.title)}" placeholder="${isG?"":"예: 보증 인원 250명이면 많은 걸까요?"}"></label>
    <label>내용 <span style="font-weight:400;color:var(--muted)" id="wlen"></span><textarea id="wbody" maxlength="${isG?30000:3000}" placeholder="${isG?"한 줄이 한 문단이에요. ### 소제목, - 목록, 1) 번호, | 표 | 칸 |, **굵게**, [글](cost.html) 링크":"상황을 자세히 적을수록 좋은 답이 달려요. 지역, 예식 시기, 예산을 같이 적어 주세요."}">${esc(p.body)}</textarea></label>
    ${isG?`<label>한마디 (글 끝에 노란 상자로 보여요)<input id="wtip" maxlength="200" value="${esc(p.tip||"")}"></label>`:`<div class="rules">· 광고·홍보, 욕설, 다른 사람을 깎아내리는 글은 지워져요.<br>· 전화번호·계좌번호 같은 개인정보는 적지 마세요.<br>· 답변이 달리면 질문은 지울 수 없어요(고치는 건 돼요).</div>`}
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="cancel">취소</button><button class="btn y" data-act="savepost" data-v="${id||""}">${id?"고친 내용 저장":"올리기"}</button></div>
  </div>`;
}

async function savePost(id){
  const isG = S.b==="guide";
  const o = {cat:$("wcat").value, title:$("wtitle").value.trim(), body:$("wbody").value.replace(/\s+$/,"")};
  if(isG){ o.grp = $("wgrp").value.trim()||null; o.tip = $("wtip").value.trim()||null; }
  if(o.title.length<2) return toast("제목을 2자 이상 적어 주세요.");
  if(o.body.trim().length<5) return toast("내용을 조금 더 적어 주세요.");
  if(!isG && !U.nick && !U.admin){ nickDlg(); return; }
  const r = id ? await SB.from("board_posts").update(o).eq("id",id).select("id").maybeSingle()
               : await SB.from("board_posts").insert(Object.assign({board:S.b}, o)).select("id").single();
  if(r.error) return toast(errMsg(r.error));
  if(isG) GUIDE = null;
  toast(id?"고쳤어요.":"올렸어요."); go({w:null, p:r.data.id});
}

// 이벤트
document.addEventListener("click", async e => {
  const t = e.target;
  if(t.id==="ov") return closeDlg();
  const tab = t.closest(".tabs button"); if(tab){ S.q=""; return go({b:tab.dataset.b, c:"전체", p:null, w:null}); }
  const pc = t.closest("[data-cat]"); if(pc){ S.q=""; return go({c:pc.dataset.cat, p:null}); }
  const pp = t.closest("[data-post]"); if(pp) return go({p:+pp.dataset.post, w:null});
  const a = t.closest("[data-act]"); if(!a) return;
  const v = a.dataset.v;
  switch(a.dataset.act){
    case "login": return login();
    case "logout": await SB.auth.signOut(); closeDlg(); await loadMe(); return render();
    case "nick": return nickDlg();
    case "savenick": return saveNick();
    case "close": return closeDlg();
    case "list": return go({p:null, w:null});
    case "cancel": return history.length>1 ? history.back() : go({w:null});
    case "write": if(v==="qna" && !(await needNick())) return; return go({b:v, w:"new", p:null});
    case "edit": return go({w:v, p:null});
    case "savepost": a.disabled=true; await savePost(v?+v:null); a.disabled=false; return;
    case "delpost": if(!confirm("이 글을 지울까요? 되돌릴 수 없어요.")) return;
      { const r = await SB.from("board_posts").delete().eq("id",+v).select("id"); if(r.error||!r.data.length) return toast(r.error?errMsg(r.error):"답변이 달린 질문은 지울 수 없어요."); GUIDE=null; toast("지웠어요."); return go({p:null}); }
    case "hidepost": { const r = await SB.from("board_posts").update({hidden: a.dataset.h==="1"}).eq("id",+v); if(r.error) return toast(errMsg(r.error)); GUIDE=null; return render(); }
    case "comment": { if(!(await needNick())) return; const body = $("cbody").value.trim(); if(!body) return toast("내용을 적어 주세요.");
      a.disabled=true; const r = await SB.from("board_comments").insert({post_id:S.p, body}); a.disabled=false;
      if(r.error) return toast(errMsg(r.error)); if(GUIDE){ const g=GUIDE.find(x=>x.id===S.p); if(g) g.comment_count++; } return render(); }
    case "delc": if(!confirm("이 댓글을 지울까요?")) return; { const r = await SB.from("board_comments").delete().eq("id",+v); if(r.error) return toast(errMsg(r.error)); GUIDE=null; return render(); }
    case "hidec": { const r = await SB.from("board_comments").update({hidden: a.dataset.h==="1"}).eq("id",+v); if(r.error) return toast(errMsg(r.error)); GUIDE=null; return render(); }
    case "like": return like(a, +v);
    case "sp": return rdMove(-1);
    case "sn": return rdMove(1);
    case "sall": { if(!RD) return; const P = RD.p; RD = null;
      $("rd").outerHTML = '<div class="doc">'+md(P.body)+'</div>'+(P.tip?`<div class="tipbox"><b>한마디</b> · ${esc(P.tip)}</div>`:"")+heartBtn(P)+goBox(P); return; }
    case "report": { const reason = prompt("신고 이유를 짧게 적어 주세요. (광고, 욕설, 개인정보 등)"); if(reason===null) return;
      const r = await SB.from("board_reports").insert({kind:a.dataset.k, target_id:+v, user_id:U.user.id, reason:reason.slice(0,200)});
      return toast(r.error ? (r.error.code==="23505"?"이미 신고했어요.":errMsg(r.error)) : "신고했어요. 운영자가 확인할게요."); }
  }
});
document.addEventListener("input", e => {
  if(e.target.id==="q" && GUIDE){ S.q = e.target.value; $("glist").innerHTML = guideList(GUIDE);
    document.querySelectorAll("#gpills button").forEach(b=>b.classList.toggle("on", !S.q.trim() && b.dataset.cat===S.c)); }
  if(e.target.id==="wbody"){ $("wlen").textContent = e.target.value.length.toLocaleString()+"자"; }
});
addEventListener("keydown", e => { if(RD && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !$("ov").classList.contains("open")){ if(e.key==="ArrowRight"){ e.preventDefault(); rdMove(1); } if(e.key==="ArrowLeft"){ e.preventDefault(); rdMove(-1); } }
  if(e.key==="Escape") closeDlg(); if(e.key==="Enter" && e.target.id==="nk" && !e.isComposing) saveNick(); });
SB.auth.onAuthStateChange((ev) => { if(ev==="SIGNED_IN"||ev==="SIGNED_OUT") loadMe().then(render); });

async function resolveSlug(){            // ?s=g8 처럼 원고 글 표시로 들어오면 글 번호로 바꿈 (첫 화면 링크용)
  const s = new URLSearchParams(location.search).get("s"); if(!s) return;
  const r = await SB.from("board_posts").select("id,board").eq("slug", s).maybeSingle();
  if(r.data){ S.b = r.data.board; S.p = r.data.id; go({}, true); }
}
let TX = null;                            // 카드 옆으로 밀기
document.addEventListener("touchstart", e => { if(RD && e.target.closest("#rdbox")) TX = [e.touches[0].clientX, e.touches[0].clientY]; }, {passive:true});
document.addEventListener("touchend", e => { if(!TX || !RD) return; const dx = e.changedTouches[0].clientX - TX[0], dy = e.changedTouches[0].clientY - TX[1]; TX = null;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) rdMove(dx < 0 ? 1 : -1); }, {passive:true});
readURL();
Promise.all([loadMe(), resolveSlug()]).then(render);
})();
</script>
