<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OUR WEDDING · 결혼 준비, 이것부터 시작하세요</title>
<meta name="description" content="결혼 준비 처음이면 이것부터. 지역별 평균 결혼 비용, 웨딩홀 하객 후기, 준비 순서와 웨딩 용어를 모아 둔 결혼 가계부예요.">
<meta property="og:title" content="OUR WEDDING · 결혼 준비, 이것부터 시작하세요">
<meta property="og:description" content="신혼집 빼고 전국 평균 6,194만원. 웨딩홀은 하객 후기로, 모르는 말은 용어 사전으로.">

<script>
  // 예전 첫 화면(평균 비용)을 ?r=지역 으로 공유한 링크는 결혼 비용 페이지로 보냄
  (function(){ var q = location.search; if (/[?&]r=/.test(q)) location.replace("cost.html" + q); })();
</script>
<style>
h1,h2,h3,h4,button,.btn,th,label,dt,.lead{text-wrap:balance}
p,li,dd,td,.m,.s,small{text-wrap:pretty}
:root{--acc:#FFF0A6;--acc2:#FFF6C9;--accs:#FFFCEC;--accl:#F1DC6E;--accd:#D9B300;--acct:#3A3200;--ink:#1C1F26;--sub:#4F5563;--muted:#8B909B;--line:#EEEEEE}
*,*::before,*::after{box-sizing:border-box;border-radius:0!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;word-break:keep-all;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
svg.owi{flex:0 0 auto}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
main.wrap{padding-top:34px;padding-bottom:30px}
@media (max-width:860px){main.wrap{padding-top:20px;padding-bottom:20px}}

.hero{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:36px;align-items:start}
@media (max-width:980px){.hero{grid-template-columns:1fr;gap:18px}}
h1{font-size:42px;letter-spacing:-1.4px;line-height:1.25;margin:0}
h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--acc) 58%)}
@media (max-width:560px){h1{font-size:28px;letter-spacing:-.8px}}
.hero .sub{font-size:16px;color:var(--sub);margin:10px 0 22px}
@media (max-width:560px){.hero .sub{font-size:14px;margin:6px 0 14px}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.tile{border:1px solid var(--line);background:#fff;padding:18px 16px;display:grid;gap:9px;align-content:start;text-decoration:none;transition:border-color .15s}
.tile:hover{border-color:var(--ink)}
.tile .bx{width:46px;height:46px;background:var(--acc);display:grid;place-items:center;color:var(--acct)}
.tile .bx svg{width:26px;height:26px}
.tile b{font-size:17px}
.tile span{font-size:13px;color:var(--muted);line-height:1.45}
@media (max-width:560px){.tile{padding:14px 12px}.tile .bx{width:40px;height:40px}.tile .bx svg{width:23px;height:23px}.tile b{font-size:15.5px}.tile span{font-size:12px}}

.side{border:1px solid var(--line)}
.side h3{font-size:15px;margin:0;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;justify-content:space-between}
.side h3 span{display:flex;align-items:center;gap:7px}
.side h3 svg{width:17px;height:17px;color:var(--muted)}
.side h3 a{font-size:12px;color:var(--muted);font-weight:500;text-decoration:none}
.side .r{display:flex;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px;text-decoration:none}
.side .r:last-child{border-bottom:0}
.side .r:hover{background:var(--accs)}
.side .r svg{width:17px;height:17px;color:var(--muted)}
.side .r em{font-style:normal;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .r small{color:var(--muted);font-size:12px;white-space:nowrap}
.side .none{padding:16px;font-size:13px;color:var(--muted);line-height:1.6}
@media (max-width:980px){.side{margin-top:30px}.side.empty{display:none}}

.sec{margin-top:44px}
@media (max-width:860px){.sec{margin-top:30px}}
.sec .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.sec h2{font-size:22px;letter-spacing:-.4px;margin:0}
@media (max-width:560px){.sec h2{font-size:18px}}
.arr{display:flex;gap:6px}
.arr button{width:40px;height:40px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.arr button svg{width:19px;height:19px}
.hint{font-size:12px;color:var(--muted);display:none}
@media (max-width:760px){.arr{display:none}.hint{display:block}}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;margin:0 -16px;padding:2px 16px 4px;scroll-padding:0 16px}
.car::-webkit-scrollbar{display:none}
.card{flex:0 0 calc((100% - 42px)/4);scroll-snap-align:start;border:2px solid var(--ink);padding:22px 20px;display:flex;flex-direction:column;gap:10px;min-height:230px;background:#fff;text-decoration:none}
.card:hover{background:var(--accs)}
.card.y{background:var(--acc);border-color:var(--accd)}
.card.y:hover{background:var(--acc)}
@media (max-width:980px){.card{flex-basis:calc((100% - 28px)/3)}}
@media (max-width:760px){.card{flex-basis:78%;min-height:200px;padding:18px 16px}}
.card .k{font-size:13px;font-weight:800;color:var(--acct);display:flex;align-items:center;gap:6px}
.card .k svg{width:18px;height:18px}
.card .big{font-size:46px;font-weight:900;letter-spacing:-2px;line-height:1}
.card .big small{font-size:19px;margin-left:2px;letter-spacing:-.4px}
.card .one{font-size:20px;font-weight:800;line-height:1.35;letter-spacing:-.4px}
.card p{margin:0;font-size:14px;color:var(--sub);line-height:1.5}
.card .go{margin-top:auto;font-size:14px;font-weight:800;display:flex;align-items:center;gap:4px}
.card .go svg{width:16px;height:16px}
@media (max-width:560px){.card .big{font-size:38px}.card .one{font-size:18px}}
.dots{display:none;gap:5px;justify-content:center;margin-top:12px}
.dots i{width:6px;height:6px;background:#DDD}
.dots i.on{background:var(--ink);width:16px}
@media (max-width:760px){.dots{display:flex}}

footer{border-top:1px solid var(--line);margin-top:40px;padding:20px 0 30px;font-size:13px;color:var(--muted);line-height:1.8}
footer a{color:var(--sub)}
</style>
</head>
<body>
<div id="ownav" data-tab="home"></div><script src="nav.js"></script>

<main class="wrap">
  <div class="hero">
    <div>
      <h1>결혼 준비,<br><em>이것부터 시작하세요</em></h1>
      <p class="sub">처음이면 1번부터 차례로요</p>
      <div class="tiles" id="tiles"></div>
    </div>
    <div class="side" id="recent"></div>
  </div>

  <div class="sec">
    <div class="hd"><h2>알고 시작하면 덜 헤매요</h2><div class="arr"><button id="pv" aria-label="이전 카드"></button><button id="nx" aria-label="다음 카드"></button></div><span class="hint">옆으로 밀어 보세요 →</span></div>
    <div class="car" id="car"></div>
    <div class="dots" id="dots"></div>
  </div>
</main>

<footer><div class="wrap">
  평균 금액은 한국소비자원 참가격(실제 계약)과 듀오 2026 결혼비용 보고서 기준이에요. 업체·날짜·옵션에 따라 달라요.<br>
  © OUR WEDDING · <a href="perks.html">혜택</a> · <a href="partner.html">광고·제휴 신청</a> · <a href="privacy.html">개인정보처리방침</a><br>
  운영 마이머니플랜 · 사업자등록번호 223-29-01904 · 문의 <a href="mailto:receipt2045@gmail.com">receipt2045@gmail.com</a>
</div></footer>

<script src="data.js"></script>
<script>
(function(){
  const N = window.OWNAV, ic = N.ic;
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // 전국 평균 (신혼집 빼고) — 결혼 비용 페이지와 같은 계산
  let total = "6,194";
  try { const D = window.OW, r = D.regions[0]; total = Math.round(r.meal + r.rental + r.deco + r.sdm + D.national.reduce((t, x) => t + x.v, 0)).toLocaleString("ko-KR"); } catch (e) {}

  const TILES = [
    ["won", "1. 예산 감 잡기", `신혼집 빼고 평균 ${total}만원`, "cost.html"],
    ["hall", "2. 웨딩홀 먼저", "날짜가 정해져야 나머지가 돼요", "halls.html"],
    ["check", "3. 할 일 순서", "1년 전부터 입주까지 120개", "app.html?go=todo"],
    ["book", "4. 모르는 말", "베뉴, 촬드, 헬퍼비..", "board.html?s=g0"],
  ];
  document.getElementById("tiles").innerHTML = TILES.map(([i, b, s, u]) => `<a class="tile" href="${u}"><span class="bx">${ic(i)}</span><b>${b}</b><span>${s}</span></a>`).join("");

  const CARDS = [
    {k:["won","예산"], big:`${total}<small>만원</small>`, p:"신혼집 빼고 전국 평균이에요. 서울이면 더 올라가요", go:"우리 지역은 얼마", u:"cost.html", y:true},
    {k:["hall","웨딩홀"], one:"“날 잡았어?”<br>제일 먼저 듣는 말", p:"인기 홀은 투어 예약도 전화 수십 통이래요", go:"웨딩홀부터인 이유", u:"board.html?s=g8"},
    {k:["utensils","하객"], one:"드레스는 아무도 기억 못 해요", p:"밥 맛이랑 주차는 몇 년 가요", go:"후기로 홀 거르기", u:"halls.html"},
    {k:["users","보증 인원"], one:"250명 잡고 230명 오면", p:"안 온 20명 밥값 120만원은 그냥 나가요", go:"하객 수 계산", u:"app.html?go=guest"},
    {k:["mail","청첩장"], one:"종이 청첩장, 많이 뽑지 마세요", p:"보증 인원만큼이면 얼추 맞아요. 남은 건 다 버려요", go:"청첩장 글 보기", u:"board.html?s=g24"},
    {k:["wallet","가계부"], one:"계약금·잔금, 언제 얼마 나가는지", p:"적어 두면 달마다 필요한 돈이 나와요", go:"가계부 쓰기", u:"app.html?go=exp"},
  ];
  const car = document.getElementById("car");
  car.innerHTML = CARDS.map(c => `<a class="card${c.y ? " y" : ""}" href="${c.u}"><div class="k">${ic(c.k[0])}${c.k[1]}</div>${c.big ? `<div class="big">${c.big}</div>` : `<div class="one">${c.one}</div>`}<p>${c.p}</p><div class="go">${c.go} ${ic("right")}</div></a>`).join("");
  document.getElementById("dots").innerHTML = CARDS.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("");
  document.getElementById("pv").innerHTML = ic("left"); document.getElementById("nx").innerHTML = ic("right");
  const step = () => (car.querySelector(".card").getBoundingClientRect().width + 14);
  document.getElementById("pv").onclick = () => car.scrollBy({left: -step() * 2});
  document.getElementById("nx").onclick = () => car.scrollBy({left: step() * 2});
  car.addEventListener("scroll", () => { const i = Math.round(car.scrollLeft / step()); document.querySelectorAll("#dots i").forEach((d, j) => d.classList.toggle("on", j === i)); }, {passive: true});

  // 최근 본 것
  const R = N.recent().slice(0, 5), box = document.getElementById("recent");
  box.innerHTML = `<h3><span>${ic("clock")}최근 본 것</span>${R.length ? '<a href="mine.html#recent">전체 ›</a>' : ""}</h3>` +
    (R.length ? R.map(x => `<a class="r" href="${esc(x.u)}">${ic(x.i || "book")}<em>${esc(x.t)}</em><small>${N.ago(x.at)}</small></a>`).join("")
              : '<div class="none">가이드 글이나 웨딩홀을 보면 여기 남아요. 다음에 들어와서 바로 이어 보면 돼요.</div>');
  box.classList.toggle("empty", !R.length);
  // 폰·태블릿에서는 카드 아래로, PC에서는 오른쪽 위로
  const hero = document.querySelector(".hero"), sec = document.querySelector(".sec");
  const place = () => { const narrow = innerWidth <= 980; if (narrow && box.parentNode === hero) sec.after(box); else if (!narrow && box.parentNode !== hero) hero.appendChild(box); };
  place(); addEventListener("resize", place);
})();
</script>
</body>
</html>
